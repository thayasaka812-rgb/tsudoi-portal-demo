<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>つどいの家 総務ポータル お試し版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 1画面ずつ見せるスマホ向けの見本帳：上に画面名、中央に画面の写し、下に切り替えのタブ。ポータル本体と同じ「ひだまり」配色で、明るい1種類だけ */
:root {
  --bg: #FFF8EC;
  --surface: #FFFFFF;
  --ink: #2B2414;
  --ink-sub: #6E5A3A;
  --line: #F2DDB8;
  --accent: #FFB703;
  --on-accent: #3A2600;
  --accent-ink: #9A5B00;
  --tint: #FFF0D6;
  --font: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --bar-h: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 2px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.mark { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center;
  background: linear-gradient(135deg, #FF8A3D, #FFB703); color: #fff; font-weight: 700; font-size: 15px; }
.top-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.top-org { font-size: 11px; color: var(--ink-sub); }
.top-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { margin-left: auto; flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--accent-ink);
  background: var(--tint); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }

main { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 14px calc(var(--bar-h) + 28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.intro { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.intro h1 { margin: 0; font-size: 17px; line-height: 1.4; text-wrap: balance; }
.intro p { margin: 0; font-size: 14px; color: var(--ink-sub); }
.screen-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.screen-head h2 { margin: 0; font-size: 18px; }
.screen-head span { font-size: 12px; color: var(--ink-sub); font-variant-numeric: tabular-nums; }
.screen-note { margin: 0; font-size: 14px; color: var(--ink-sub); }
.shot { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 6px 20px rgb(120 80 0 / .08); }
.shot img { display: block; width: 100%; height: auto; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager button { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; padding: 8px 12px; cursor: pointer; }
.pager .next { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.pager button:disabled { opacity: .45; cursor: default; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab { height: var(--bar-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--ink-sub); cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="true"] { color: var(--accent-ink); font-weight: 700; }
.tab[aria-current="true"] svg { color: var(--accent-ink); }

.sheet-bg { position: fixed; inset: 0; z-index: 10; background: rgb(43 36 20 / .35); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 80%; overflow-y: auto;
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding-inline: 16px; padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
.sheet h2 { margin: 0 0 10px; font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.grid button { min-height: 56px; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.grid button b { font-size: 14px; }
.grid button small { font-size: 11px; color: var(--ink-sub); line-height: 1.4; }
.grid button[aria-current="true"] { border-color: var(--accent); background: var(--tint); }
.sheet .close { margin-top: 12px; width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .shot img { animation: fade .25s ease-out; } @keyframes fade { from { opacity: .4; } } }

.shot { position: relative; }
.hotspot { position: absolute; left: 3%; right: 3%; border: 0; padding: 0; background: transparent; border-radius: 16px; cursor: pointer; }
.hotspot:focus-visible { outline: 3px solid var(--accent-ink); }
.board-btn { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar-h) + 12px + env(safe-area-inset-bottom, 0px)); z-index: 7;
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0;
  background: var(--ink); color: #FFF8EC; font-weight: 700; font-size: 14px; box-shadow: 0 8px 22px rgb(43 36 20 / .25); cursor: pointer; white-space: nowrap; }
.board-bg { position: fixed; inset: 0; z-index: 20; background: rgb(43 36 20 / .35); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.board { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 88%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgb(43 36 20 / .18);
  transform: translateY(105%); transition: transform .32s cubic-bezier(.16,1,.3,1);
  padding-inline: 16px; padding-block: 8px calc(20px + env(safe-area-inset-bottom, 0px)); }
.board-open .board { transform: none; }
.board-open .board-bg { opacity: 1; pointer-events: auto; }
.board-inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.grip { width: 44px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 2px; }
.board-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.board-head h2 { margin: 0; font-size: 18px; }
.board-head span { font-size: 12px; color: var(--ink-sub); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--tint); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); font-weight: 700; box-shadow: 0 1px 3px rgb(43 36 20 / .12); }
.divs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.div-card { background: var(--surface); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; box-shadow: inset 0 5px 0 var(--c); }
.div-card h3 { margin: 4px 0 0; font-size: 13px; color: var(--ink-sub); font-weight: 500; }
.div-card .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; overflow-wrap: anywhere; }
.div-card .sub { font-size: 12px; color: var(--ink-sub); font-variant-numeric: tabular-nums; }
.groups { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.group { display: flex; flex-direction: column; gap: 6px; }
.group h3 { margin: 6px 0 0; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.group h3::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.rows { background: var(--surface); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 6.5em 1fr auto; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row b { font-size: 14px; font-weight: 500; }
.bar { height: 8px; border-radius: 99px; background: var(--tint); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--c); }
.row .val { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row .val small { display: block; font-size: 11px; font-weight: 400; color: var(--ink-sub); }
.neg { color: #A01A29; }
.note { margin: 0; font-size: 12px; color: var(--ink-sub); }
.board-close { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .board, .board-bg { transition: none; } }
</style>
</head>
<body>


<header class="top">
  <span class="mark" aria-hidden="true">つ</span>
  <span class="top-text"><span class="top-org">社会福祉法人 つどいの家</span><span class="top-title">総務ポータル</span></span>
  <span class="pill">お試し版</span>
</header>

<main>
  <section class="intro" id="intro">
    <h1>総務の仕事をひとつの画面にまとめたポータルです</h1>
    <p>お知らせ、申請、研修の受講記録、事務の締切、総務の ToDo などを、職員みんなで使っています。下のボタンで画面を切り替えてご覧ください。</p>
  </section>
  <div class="screen-head"><h2 id="screen-title">ホーム</h2><span id="screen-count">1 / 12</span></div>
  <p class="screen-note" id="screen-note"></p>
  <div class="shot"><button type="button" class="hotspot" id="hotspot" aria-label="事業所ごとの数字を見る" hidden></button><img id="shot" src="img/home.jpg" alt="" width="780" height="5346" decoding="async"></div>
  <div class="pager">
    <button type="button" id="prev">← 前の画面</button>
    <button type="button" class="next" id="next">次の画面 →</button>
  </div>
</main>

<nav class="tabs" aria-label="画面の切り替え">
  <button type="button" class="tab" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button type="button" class="tab" data-go="notices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>お知らせ</button>
  <button type="button" class="tab" data-go="todos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"/></svg>ToDo</button>
  <button type="button" class="tab" data-go="trainings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>研修</button>
  <button type="button" class="tab" id="open-all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>すべての画面</button>
</nav>


<button type="button" class="board-btn" id="board-btn" hidden>▲ 事業所ごとの数字を見る</button>
<div class="board-bg" id="board-bg"></div>
<section class="board" id="board" role="dialog" aria-modal="true" aria-labelledby="board-title" aria-hidden="true">
  <div class="board-inner">
    <div class="grip" aria-hidden="true"></div>
    <div class="board-head"><h2 id="board-title">部門・事業所ごとの数字</h2><span>2026年9月</span></div>
    <div class="seg" role="group" aria-label="表示する数字">
      <button type="button" id="seg-usage" aria-pressed="true">利用実績</button>
      <button type="button" id="seg-money" aria-pressed="false">収支</button>
    </div>
    <div class="divs" id="divs"></div>
    <div id="groups" class="groups"></div>
    <p class="note">数字は見本です（実際の数字ではありません）。</p>
    <button type="button" class="board-close" id="board-close">閉じる</button>
  </div>
</section>
<div class="sheet-bg" id="sheet-bg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <h2 id="sheet-title">見たい画面を選んでください</h2>
  <div class="grid" id="grid"></div>
  <button type="button" class="close" id="close-sheet">閉じる</button>
</div>

<script>

const HOTSPOT = { home: [14.78, 10.48] };
const SCREENS = [
  { key: 'home', name: 'ホーム', h: 5346, note: '利用者数や収支のカードをタップすると、事業所ごとの数字が下から出てきます。開くと最初に出る画面です。必読のお知らせ、自分のやること、利用者数や収支の数字、掲示板の新着が並びます。' },
  { key: 'notices', name: 'お知らせ', h: 1936, note: '法人内のお知らせの一覧です。必読のものは、誰が読んだかを総務で確認できます。' },
  { key: 'notice', name: 'お知らせ（詳細）', h: 2458, note: 'お知らせを開いたところです。読んだら「確認しました」を押します。' },
  { key: 'feed', name: '掲示板', h: 8104, note: '職員どうしの連絡や「ありがとう」を気軽に書き込める場所です。' },
  { key: 'requests', name: '申請', h: 1688, note: '休暇・経費・購入などの申請を出し、承認の進み具合を確認できます。' },
  { key: 'calendar', name: 'カレンダー', h: 2946, note: '法人の行事と、総務職員の Google カレンダーの予定を重ねて見られます。' },
  { key: 'members', name: 'メンバー', h: 3200, note: '職員の名鑑です。担当業務と、いま在席しているかがわかります。' },
  { key: 'messages', name: 'メッセージ', h: 1688, note: '職員どうしで個別やグループでやりとりできます。' },
  { key: 'trainings', name: '研修', h: 4564, note: '研修の動画をその場で再生し、見終わったら「受講しました」を押します。虐待防止など法定研修の受講状況は、総務が一覧で確認できます。' },
  { key: 'todos', name: '総務の ToDo', h: 13510, note: '総務全体と一人ひとりの ToDo、進み具合を一目で見られます。締切が近づいた事務は自動で ToDo に入ります。' },
  { key: 'deadlines', name: '期限', h: 13608, note: '国保連請求や処遇改善加算の報告などの事務の締切と、車検・保険・契約の更新期限をまとめて管理します。' },
  { key: 'kpi', name: '経営指標', h: 3120, note: '下の「事業所ごとの数字を見る」で、部門・事業所ごとの利用者数と収支を見られます。事業所ごとの利用者数と月次の収支を、CSV を取り込んでグラフで見られます。' },
];
const $ = (id) => document.getElementById(id);
let cur = 0;

function show(i, scroll) {
  cur = (i + SCREENS.length) % SCREENS.length;
  const s = SCREENS[cur];
  const img = $('shot');
  img.src = 'img/' + s.key + '.jpg';
  img.height = s.h;
  img.alt = s.name + 'の画面';
  $('screen-title').textContent = s.name;
  $('screen-count').textContent = (cur + 1) + ' / ' + SCREENS.length;
  $('screen-note').textContent = s.note;
  $('intro').hidden = cur !== 0;
  const hs = HOTSPOT[s.key];
  $('board-btn').hidden = !(s.key === 'home' || s.key === 'kpi');
  $('hotspot').hidden = !hs;
  if (hs) { $('hotspot').style.top = hs[0] + '%'; $('hotspot').style.height = hs[1] + '%'; }
  $('prev').disabled = cur === 0;
  $('next').textContent = cur === SCREENS.length - 1 ? '最初の画面へ →' : '次の画面 →';
  document.querySelectorAll('.tab[data-go]').forEach((t) => t.setAttribute('aria-current', String(t.dataset.go === s.key)));
  document.querySelectorAll('#grid button').forEach((b, k) => b.setAttribute('aria-current', String(k === cur)));
  if (location.hash.slice(1) !== s.key) history.replaceState(null, '', '#' + s.key);
  if (scroll) window.scrollTo({ top: 0 });
  // 次の画面を先に読んでおく（切り替えを速くする）
  const next = new Image(); next.src = 'img/' + SCREENS[(cur + 1) % SCREENS.length].key + '.jpg';
}

function openSheet(open) { $('sheet').hidden = !open; $('sheet-bg').hidden = !open; if (open) $('grid').querySelector('[aria-current="true"]')?.focus(); }

SCREENS.forEach((s, k) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = '<b></b><small></small>';
  b.querySelector('b').textContent = s.name;
  b.querySelector('small').textContent = s.note.split('。')[0];
  b.addEventListener('click', () => { openSheet(false); show(k, true); });
  $('grid').appendChild(b);
});
document.querySelectorAll('.tab[data-go]').forEach((t) => t.addEventListener('click', () => show(SCREENS.findIndex((s) => s.key === t.dataset.go), true)));
$('open-all').addEventListener('click', () => openSheet(true));
$('close-sheet').addEventListener('click', () => openSheet(false));
$('sheet-bg').addEventListener('click', () => openSheet(false));
$('prev').addEventListener('click', () => show(cur - 1, true));
$('next').addEventListener('click', () => show(cur + 1, true));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') openSheet(false); });
// ---------- 部門・事業所ごとの数字（見本） ----------
const DIVS = [
  { name: '日中活動支援部門', c: '#FF8A3D', offices: [['コペル', 412, 21, 4120000, 3710000], ['仙台', 386, 20, 3860000, 3540000], ['アプリ', 358, 18, 3580000, 3330000], ['八木山', 331, 17, 3310000, 3120000], ['若福', 297, 15, 2970000, 3050000]] },
  { name: '地域生活支援部門', c: '#3BA3FF', offices: [['P南光台', 214, 12, 2140000, 1980000], ['P支倉', 196, 11, 1960000, 1870000], ['P若林', 188, 10, 1880000, 1910000], ['グループホーム', 290, 10, 2610000, 2360000]] },
];
let mode = 'usage';
const yen = (n) => (n < 0 ? '-¥' : '¥') + Math.abs(n).toLocaleString('ja-JP');
const man = (n) => (n < 0 ? '-' : '') + Math.round(Math.abs(n) / 10000).toLocaleString('ja-JP') + '万円';
function sum(d, k) { return d.offices.reduce((a, o) => a + o[k], 0); }
function renderBoard() {
  $('seg-usage').setAttribute('aria-pressed', String(mode === 'usage'));
  $('seg-money').setAttribute('aria-pressed', String(mode === 'money'));
  $('divs').innerHTML = '';
  $('groups').innerHTML = '';
  const all = DIVS.flatMap((d) => d.offices);
  const max = mode === 'usage' ? Math.max(...all.map((o) => o[1])) : Math.max(...all.map((o) => o[3]));
  for (const d of DIVS) {
    const card = document.createElement('div');
    card.className = 'div-card'; card.style.setProperty('--c', d.c);
    const inc = sum(d, 3), exp = sum(d, 4), bal = inc - exp;
    card.innerHTML = mode === 'usage'
      ? `<h3></h3><span class="big">${sum(d, 1).toLocaleString('ja-JP')}人</span><span class="sub">延べ利用者数<br>実利用者 ${sum(d, 2)}人</span>`
      : `<h3></h3><span class="big ${bal < 0 ? 'neg' : ''}">${man(bal)}</span><span class="sub">収支差額<br>収入 ${man(inc)}</span>`;
    card.querySelector('h3').textContent = d.name;
    $('divs').appendChild(card);
    const g = document.createElement('div');
    g.className = 'group'; g.style.setProperty('--c', d.c);
    g.innerHTML = '<h3></h3><div class="rows"></div>';
    g.querySelector('h3').textContent = d.name + '（' + d.offices.length + '事業所）';
    for (const o of d.offices) {
      const r = document.createElement('div');
      r.className = 'row';
      const b = o[3] - o[4];
      const w = Math.round(((mode === 'usage' ? o[1] : o[3]) / max) * 100);
      r.innerHTML = mode === 'usage'
        ? `<b></b><span class="bar"><i style="width:${w}%"></i></span><span class="val">${o[1]}人<small>実 ${o[2]}人</small></span>`
        : `<b></b><span class="bar"><i style="width:${w}%"></i></span><span class="val ${b < 0 ? 'neg' : ''}">${yen(b)}<small>収入 ${man(o[3])}</small></span>`;
      r.querySelector('b').textContent = o[0];
      g.querySelector('.rows').appendChild(r);
    }
    $('groups').appendChild(g);
  }
}
function openBoard(open) {
  document.body.classList.toggle('board-open', open);
  $('board').setAttribute('aria-hidden', String(!open));
  if (open) { $('board').scrollTop = 0; $('seg-usage').focus({ preventScroll: true }); }
}
$('seg-usage').addEventListener('click', () => { mode = 'usage'; renderBoard(); });
$('seg-money').addEventListener('click', () => { mode = 'money'; renderBoard(); });
$('board-btn').addEventListener('click', () => openBoard(true));
$('hotspot').addEventListener('click', () => openBoard(true));
$('board-bg').addEventListener('click', () => openBoard(false));
$('board-close').addEventListener('click', () => openBoard(false));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') openBoard(false); });
// 下に引っぱると閉じる
let y0 = null;
$('board').addEventListener('touchstart', (e) => { y0 = $('board').scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
$('board').addEventListener('touchend', (e) => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 80) openBoard(false); y0 = null; });
renderBoard();

const start = SCREENS.findIndex((s) => s.key === location.hash.slice(1));
show(start < 0 ? 0 : start, false);
</script>
