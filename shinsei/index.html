  if (!rec['現住所']) errs.push('現住所を入力してください。');

  const hasAddress = !!rec['新住所'];
  const hasCommute = !!rec['届出事由'] || routes.length > 0;
  const hasHousing = !!(rec['賃貸契約者'] || rec['住居費_月額']);
  if (!hasAddress && !hasCommute && !hasHousing) {
    errs.push('住所変更・通勤手当・住居手当のうち、届け出るものを1つ以上入力してください。');
  }
  if (hasAddress && !rec['事実発生年月日']) errs.push('住所変更の事実発生年月日を入力してください。');
  if (hasCommute) {
    if (!rec['届出事由']) errs.push('通勤手当の届け出の事由を選んでください。');
    if (!routes.length) errs.push('通勤経路を1つ以上入力してください。');
    if (String(rec['届出事由']).indexOf('6.その他') !== -1 && !rec['届出事由_その他']) {
      errs.push('届け出の事由「その他」の内容を入力してください。');
    }
    routes.forEach(r => {
      if (!r['通勤方法'] || !r['区間_自'] || !r['区間_至']) {
        errs.push('通勤経路 ' + r['順'] + ' の通勤方法と区間を入力してください。');
      }
    });
  }
  if (String(rec['添付書類']).indexOf('その他') !== -1 && !rec['添付書類_その他']) {
    errs.push('添付書類「その他」の内容を入力してください。');
  }
  return errs;
}

/** 様式7：処理内容（事業所の事務員か労務担当が入力：適用開始年月・支給額・片道1回あたりの額。受理日・処理日は自動） */
function cleanProcess7_(fields) {
  return {
    '適用開始年月': month_(fields['適用開始年月']),
    '通勤手当_支給額': money_(fields['通勤手当_支給額']),
    '住居手当_支給額': money_(fields['住居手当_支給額']),
    '通勤手当_回単価': money_(fields['通勤手当_回単価'])
  };
}

/** 様式8：申請者の入力を整える */
function cleanFields8_(src, m) {
  const O = FORM8.OPTIONS;
  const office = String(src['所属事業所'] || '');
  const pick = (v, list) => list.indexOf(v) !== -1 ? v : '';
  const reason = pick(src['届出事由'], O.REASONS);
  // 選んだ事由の欄だけを残す（途中で事由を変えたときの消し忘れを印刷に出さない）
  const only = (r, v) => reason === r ? v : '';
  return {
    '申請者氏名': str_(src['申請者氏名'], 100),
    '所属事業所': m.offices.indexOf(office) !== -1 ? office : '',
    '住所': str_(src['住所'], 300),
    '届出事由': reason,
    '採用年月日': only('1.採用', date_(src['採用年月日'])),
    '異動内容': only('2.扶養親族の異動', pick(src['異動内容'], O.CHANGES)),
    '異動内容_その他': only('2.扶養親族の異動', src['異動内容'] === 'その他' ? str_(src['異動内容_その他'], 100) : ''),
    '異動年月日': only('2.扶養親族の異動', date_(src['異動年月日'])),
    'その他_内容': only('3.その他', str_(src['その他_内容'], 300)),
    'その他_届出年月日': only('3.その他', date_(src['その他_届出年月日']))
  };
}

/** 様式8：扶養親族の表。年齢は生年月日から今日の時点で計算する */
function cleanDependents_(list) {
  const O = FORM8.OPTIONS;
  const today = Utilities.formatDate(new Date(), CFG.TZ, 'yyyy-MM-dd');
  return list.slice(0, FORM8.MAX_DEPENDENTS).map(r => {
    const birth = date_(r['生年月日']);
    return {
      '氏名': str_(r['氏名'], 100),
      'フリガナ': str_(r['フリガナ'], 100),
      '続柄': str_(r['続柄'], 30),
      '生年月日': birth,
      '年齢': birth ? String(ageOn_(birth, today)) : '',
      '同別居': O.LIVING.indexOf(r['同別居']) !== -1 ? r['同別居'] : '',
      '職業': str_(r['職業'], 100),
      '年収額': money_(r['年収額']),
      '備考': str_(r['備考'], 200)
    };
  }).filter(r => ['氏名', 'フリガナ', '続柄', '生年月日', '同別居', '職業', '年収額', '備考'].some(k => r[k] !== ''))
    .map((r, i) => Object.assign({ '順': String(i + 1) }, r));
}

/** 満年齢（birth・on は yyyy-MM-dd など、年・月・日の順の日付）。読めなければ空 */
function ageOn_(birth, on) {
  const parse = v => (String(v).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/) || []).slice(1).map(Number);
  const b = parse(birth);
  const d = parse(on);
  if (b.length < 3 || d.length < 3) return '';
  let age = d[0] - b[0];
  if (d[1] < b[1] || (d[1] === b[1] && d[2] < b[2])) age--;
  return Math.max(0, age);
}

/** 様式8：提出時のチェック（エラー文の配列を返す） */
function validate8_(rec, children, m) {
  const deps = children.dependents || [];
  const errs = [];
  if (!rec['申請者氏名']) errs.push('氏名を入力してください。');
  if (!rec['所属事業所']) errs.push('所属事業所を選んでください。');
  if (!rec['住所']) errs.push('住所を入力してください。');
  const r = rec['届出事由'];
  if (!r) errs.push('届出の事由を選んでください。');
  if (r === '1.採用' && !rec['採用年月日']) errs.push('採用の年月日を入力してください。');
  if (r === '2.扶養親族の異動') {
    if (!rec['異動内容']) errs.push('異動の内容（出生・婚姻・死亡・その他）を選んでください。');
    if (rec['異動内容'] === 'その他' && !rec['異動内容_その他']) errs.push('異動の内容「その他」を入力してください。');
    if (!rec['異動年月日']) errs.push('異動の年月日を入力してください。');
  }
  if (r === '3.その他') {
    if (!rec['その他_内容']) errs.push('届出の事由「その他」の内容を入力してください。');
    if (!rec['その他_届出年月日']) errs.push('届出の事由「その他」の年月日を入力してください。');
  }
  if (!deps.length) errs.push('扶養親族を1人以上入力してください。');
  deps.forEach(d => {
    if (!d['氏名'] || !d['続柄'] || !d['生年月日']) {
      errs.push('扶養親族 ' + d['順'] + ' 人目の氏名・続柄・生年月日を入力してください。');
    }
  });
  return errs;
}

/** 様式8：処理内容（〇年〇月から〇円 増額／減額 し〇円とする・受理日・処理日） */
function cleanProcess8_(fields) {
  return {
    '支給開始年月': month_(fields['支給開始年月']),
    '増減': FORM8.OPTIONS.UPDOWN.indexOf(fields['増減']) !== -1 ? fields['増減'] : '',
    '差額': money_(fields['差額']),
    '変更後の金額': money_(fields['変更後の金額'])
  };
}

/** 全様式共通：所属事業所の決裁者が決裁者リストにそろっているか（エラー文の配列を返す） */
function approverErrors_(rec, m) {
  const errs = [];
  if (rec['所属事業所']) {
    STEPS.forEach(s => {
      if (isSkipped_(s, rec['所属事業所'], m) || approverFor_(s, rec['所属事業所'], m)) return;
      const def = m.flowDefs[s] || {};
      errs.push(def.byOffice
        ? '決裁者リストに「' + rec['所属事業所'] + '」の「' + (def.rosterRole || roleOf_(s, m)) + '」がいません。労務担当に連絡してください。'
        : '決裁者リストに「' + (def.rosterRole || roleOf_(s, m)) + '」がいません。労務担当に連絡してください。');
    });
  }
  return errs;
}

/** 改行以外の制御文字を取り除き、前後の空白を削って長さを制限する */
function str_(v, max) {
  return String(v === undefined || v === null ? '' : v)
    .split('')
    .filter(c => c === '\n' || (c.charCodeAt(0) >= 32 && c.charCodeAt(0) !== 127))
    .join('')
    .trim()
    .slice(0, max || 300);
}
function lc_(v) { return String(v || '').trim().toLowerCase(); }
/** 全角数字を半角にする */
function hankaku_(v) {
  return String(v === undefined || v === null ? '' : v)
    .replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
}
/** 金額・分など0以上の整数。カンマ・「円」は取り除く */
function money_(v) {
  const s = hankaku_(v).replace(/[,，円\s]/g, '');
  return /^\d{1,9}$/.test(s) ? String(Number(s)) : '';
}
function date_(v) {
  const s = String(v || '').trim();
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
}
function month_(v) {
  const s = String(v || '').trim();
  return /^\d{4}-\d{2}$/.test(s) ? s : '';
}
function pickList_(v, allowed) {
  const arr = Array.isArray(v) ? v : String(v || '').split('、');
  return allowed.filter(a => arr.indexOf(a) !== -1).join('、');
}
function parseJson_(s, fallback) {
  if (!s) return fallback;
  try { return JSON.parse(s); } catch (e) { return fallback; }
}
function now_() { return Utilities.formatDate(new Date(), CFG.TZ, 'yyyy/MM/dd HH:mm'); }

/* =============================================================
 * シート読み書き
 * ============================================================= */
// 1回の呼び出しの中では、スプレッドシートを開くのは1度だけにする（開くたびに時間がかかるため）
/*
 * 時間の計測：console.time／timeEnd で実行ログに残し、計測モード（URL に ?debug=1）のときは画面にも出す
 */
let TIMING = [];
function tm_(label, fn) {
  if (console.time) console.time(label);
  const t0 = Date.now();
  try {
    return fn();
  } finally {
    if (console.timeEnd) console.timeEnd(label);
    TIMING.push([label, Date.now() - t0]);
  }
}

/** スクリプト プロパティ（1回の呼び出しの中では1度だけまとめて読む。1つずつ読むと、そのたびに時間がかかるため） */
let PROPS_MEMO = null;
function prop_(key) {
  if (!PROPS_MEMO) PROPS_MEMO = tm_('設定（スクリプト プロパティ）を読む', () => PropertiesService.getScriptProperties().getProperties());
  return PROPS_MEMO[key] || null;
}

let SS_MEMO = null;
function ss_() {
  if (SS_MEMO) return SS_MEMO;
  const active = SpreadsheetApp.getActiveSpreadsheet();
  if (active) return (SS_MEMO = active);
  const id = prop_(CFG.PROP.SS);
  if (!id) throw new Error('スプレッドシートが見つかりません。メニュー「届出アプリ」→「初期設定」を実行してください。');
  return (SS_MEMO = tm_('スプレッドシートを開く（本体）', () => SpreadsheetApp.openById(id)));
}

/** 起案・物品購入等のスプレッドシート（まだ分けていなければ null＝本体に保存） */
let SSB_MEMO;
function ssB_() {
  if (SSB_MEMO !== undefined) return SSB_MEMO;
  const id = prop_(CFG.PROP.B_SS);
  SSB_MEMO = null;
  if (id) {
    try {
      SSB_MEMO = tm_('スプレッドシートを開く（起案・物品購入等）', () => SpreadsheetApp.openById(id));
    } catch (e) {
      throw new Error('起案・物品購入等のスプレッドシートを開けませんでした。オーナーのアカウントで開けるか確認してください。');
    }
  }
  return SSB_MEMO;
}

/** 起案・物品購入等（グループB）の届出と、何行も付く表のシート名 */
function bSheetNames_() {
  const names = [];
  Object.keys(FORMS).filter(k => FORMS[k].group === 'B').forEach(k => {
    names.push(FORMS[k].sheet);
    Object.keys(FORMS[k].children || {}).forEach(n => names.push(FORMS[k].children[n].sheet));
  });
  return names;
}

/** シート name が入っているスプレッドシート */
function sheetSs_(name) {
  return (bSheetNames_().indexOf(name) !== -1 && ssB_()) || ss_();
}

function me_() {
  const email = lc_(Session.getActiveUser().getEmail());
  if (!email) throw new Error('ログイン中のアカウントを確認できませんでした。法人のGoogleアカウントで開き直してください。');
  // テスト運用で「申請できる人」を書いたときは、その人とお知らせする人（決裁者）だけが使える
  const trial = masters_().trial;
  if (trial && trial.users.length && trial.users.indexOf(email) === -1 && trial.notify.indexOf(email) === -1) {
    throw new Error('ただいまテスト運用中のため、この電子申請を使える人は限られています。');
  }
  return email;
}

function withLock_(fn) {
  const lock = LockService.getScriptLock();
  if (!lock.tryLock(30000)) throw new Error('混み合っています。少し待ってからもう一度お試しください。');
  // ほかの人の書き込みを反映するため、ロックを取ったら読み直す
  VALUES_MEMO = {};
  try {
    return fn();
  } finally {
    lock.releaseLock();
  }
}

/** シートを見出し名で読む。各行は {見出し: 値, _row: 行番号} */
function table_(name, sheet) {
  const sh = sheet || sheetSs_(name).getSheetByName(name);
  if (!sh) throw new Error('「' + name + '」シートがありません。メニュー「届出アプリ」→「初期設定」を実行してください。');
  return tableOf_(sh, sh.getDataRange().getValues());
}

/** シートの値（1行目が見出し）を {sh, headers, rows} にする */
function tableOf_(sh, values) {
  const headers = (values[0] || []).map(h => String(h).trim());
  const rows = values.slice(1).map((v, i) => {
    const o = { _row: i + 2 };
    headers.forEach((h, j) => { if (h) o[h] = cell_(v[j]); });
    return o;
  });
  return { sh: sh, headers: headers, rows: rows };
}

/* -------------------------------------------------------------
 * シートをまとめて読む（速くするため）
 * 1枚ずつ読むと1枚ごとに時間がかかるので、Sheets API（高度なサービス）で1回にまとめて読む。
 * 読んだ値は1回の呼び出しの中だけ覚えておき、書き込んだら忘れる（VALUES_MEMO）。
 * ------------------------------------------------------------- */
let VALUES_MEMO = {};
let SHEET_NAMES_MEMO = null;

/** 本体と起案・物品購入等のスプレッドシートにあるシート名（スプレッドシートの ID ごと） */
function sheetNames_(ss) {
  return sheetNamesById_(ss.getId());
}

/** 画面の表示に使うシート（届出・何行も付く表・決裁ルート・事業所住所） */
function dataSheetNames_() {
  // テスト運用のシートも一緒に読む（別々に読むと、そのぶん時間がかかるため）
  const names = [CFG.SHEET.FLOW, CFG.SHEET.OFFICE_ADDRESS, CFG.SHEET.TRIAL];
  Object.keys(FORMS).forEach(k => {
    names.push(FORMS[k].sheet);
    Object.keys(FORMS[k].children || {}).forEach(n => names.push(FORMS[k].children[n].sheet));
  });
  return uniq_(names);
}

/** names のシートのうち、まだ読んでいないものをまとめて読む */
function prefetch_(names, withRoster) {
  // スプレッドシートごとに分けて、それぞれ1回で読む（Sheets API。スプレッドシートを開かずに読めるので速い）
  // まだ作っていないシートは「無い」と覚えて（null）、何度も探しに行かない
  const need = uniq_(names).filter(n => !(n in VALUES_MEMO));
  if (!need.length && !withRoster) return;
  const bySs = {};
  // シートの名前をまだ覚えていないスプレッドシートは、まとめて同時に調べる
  warmSheetNames_(uniq_(need.map(ssIdFor_).concat(withRoster ? [rosterId_()] : [])).filter(Boolean));
  need.forEach(n => {
    const id = ssIdFor_(n);
    if (!id || sheetNamesById_(id).indexOf(n) === -1) { VALUES_MEMO[n] = null; return; }
    (bySs[id] = bySs[id] || []).push(n);
  });
  // スプレッドシートが2つ以上なら、同時に読む（順番に読むと、そのぶん待つため）。決裁者リストも一緒に読める
  const jobs = Object.keys(bySs).map(id => ({
    id: id, names: bySs[id],
    done: vrs => { vrs.forEach((vr, i) => { VALUES_MEMO[bySs[id][i]] = vr.values || []; }); delete bySs[id]; }
  }));
  if (withRoster) {
    try {
      const rid = rosterId_();
      jobs.push({ id: rid, names: [sheetNamesById_(rid)[0]], done: vrs => { ROSTER_FETCHED = (vrs[0] && vrs[0].values) || []; } });
    } catch (err) {
      console.warn('決裁者リストは、あとで読みます: ' + err);
    }
  }
  if (jobs.length > 1 || (withRoster && jobs.length)) fetchValuesAll_(jobs);
  Object.keys(bySs).forEach(id => {
    const list = bySs[id];
    if (typeof Sheets !== 'undefined') {
      try {
        const res = tm_('シートをまとめて読む（' + list.length + '枚）', () => Sheets.Spreadsheets.Values.batchGet(id, {
          ranges: list.map(n => "'" + n.replace(/'/g, "''") + "'"),
          valueRenderOption: 'FORMATTED_VALUE'
        }));
        (res.valueRanges || []).forEach((vr, i) => { VALUES_MEMO[list[i]] = vr.values || []; });
        return;
      } catch (err) {
        console.warn('まとめて読めなかったので1枚ずつ読みます: ' + err);
        clearSheetNamesCache_();
      }
    }
    list.forEach(n => {
      const sh = sheetSs_(n).getSheetByName(n);
      VALUES_MEMO[n] = sh ? sh.getDataRange().getValues() : null;
    });
  });
}

/** いくつかのスプレッドシートを同時に読む（Sheets API）。読めた分は job.done を呼ぶ。だめなら何もしない（あとで1つずつ読む） */
function fetchValuesAll_(jobs) {
  try {
    const token = ScriptApp.getOAuthToken();
    const reqs = jobs.map(job => ({
      url: 'https://sheets.googleapis.com/v4/spreadsheets/' + encodeURIComponent(job.id) + '/values:batchGet?valueRenderOption=FORMATTED_VALUE&' +
        job.names.map(n => 'ranges=' + encodeURIComponent("'" + n.replace(/'/g, "''") + "'")).join('&'),
      headers: { Authorization: 'Bearer ' + token },
      muteHttpExceptions: true
    }));
    const res = tm_('シートを同時に読む（' + jobs.length + 'つのスプレッドシート）', () => UrlFetchApp.fetchAll(reqs));
    res.forEach((r, i) => {
      if (r.getResponseCode() !== 200) {
        console.warn('同時に読めなかったので、あとで読みます: ' + r.getResponseCode());
        return;
      }
      jobs[i].done(JSON.parse(r.getContentText()).valueRanges || []);
    });
  } catch (err) {
    console.warn('同時に読めなかったので、1つずつ読みます: ' + err);
  }
}

/** シートが入っているスプレッドシートのID（開かずに分かる。スクリプト プロパティから） */
function ssIdFor_(name) {
  const b = bSheetNames_().indexOf(name) !== -1 ? prop_(CFG.PROP.B_SS) : '';
  return b || prop_(CFG.PROP.SS) || (SpreadsheetApp.getActiveSpreadsheet() || ss_()).getId();
}

/**
 * スプレッドシートにあるシートの名前（10分覚えておく）。Sheets API で名前だけ取るので、スプレッドシートを開かなくてよい。
 * シートを作ったり消したりしたら clearSheetNamesCache_ で忘れる
 */
// 6時間（覚えておける一番長い時間）。アプリでシートを作ったときと、読めなかったときは忘れて調べ直す。
// 「開くのを速く保つ」（4時間ごと）でも調べ直すので、ふだんは覚えたままになる
const SHEET_NAMES_CACHE_SEC = 21600;
function sheetNamesById_(id) {
  SHEET_NAMES_MEMO = SHEET_NAMES_MEMO || {};
  if (SHEET_NAMES_MEMO[id]) return SHEET_NAMES_MEMO[id];
  const cache = CacheService.getScriptCache();
  const hit = cache.get('sheetnames:' + id);
  if (hit) return (SHEET_NAMES_MEMO[id] = JSON.parse(hit));
  let names;
  if (typeof Sheets !== 'undefined') {
    try {
      const res = tm_('シートの名前を調べる', () => Sheets.Spreadsheets.get(id, { fields: 'sheets.properties.title' }));
      names = (res.sheets || []).map(x => x.properties.title);
    } catch (err) {
      console.warn('シートの名前を Sheets API で取れませんでした: ' + err);
    }
  }
  if (!names) {
    const active = SpreadsheetApp.getActiveSpreadsheet();
    const ss = active && active.getId() === id ? active : (SSB_MEMO && SSB_MEMO.getId() === id ? SSB_MEMO : SpreadsheetApp.openById(id));
    names = ss.getSheets().map(sh => sh.getName());
  }
  try { cache.put('sheetnames:' + id, JSON.stringify(names), SHEET_NAMES_CACHE_SEC); } catch (e) { /* 覚えられなくても続ける */ }
  return (SHEET_NAMES_MEMO[id] = names);
}

/** ids のうち、シートの名前を覚えていないスプレッドシートの分を、同時に調べて覚える（だめなら何もしない。あとで1つずつ調べる） */
function warmSheetNames_(ids) {
  SHEET_NAMES_MEMO = SHEET_NAMES_MEMO || {};
  const cache = CacheService.getScriptCache();
  const left = ids.filter(id => !SHEET_NAMES_MEMO[id]);
  if (!left.length) return;
  const hits = cache.getAll(left.map(id => 'sheetnames:' + id)) || {};
  const miss = left.filter(id => {
    const hit = hits['sheetnames:' + id];
    if (hit) SHEET_NAMES_MEMO[id] = JSON.parse(hit);
    return !hit;
  });
  if (miss.length < 2) return;   // 1つだけなら、ふつうに調べる（sheetNamesById_）
  try {
    const token = ScriptApp.getOAuthToken();
    const res = tm_('シートの名前を同時に調べる（' + miss.length + 'つ）', () => UrlFetchApp.fetchAll(miss.map(id => ({
      url: 'https://sheets.googleapis.com/v4/spreadsheets/' + encodeURIComponent(id) + '?fields=sheets.properties.title',
      headers: { Authorization: 'Bearer ' + token },
      muteHttpExceptions: true
    }))));
    const put = {};
    res.forEach((r, i) => {
      if (r.getResponseCode() !== 200) return;
      const names = (JSON.parse(r.getContentText()).sheets || []).map(x => x.properties.title);
      SHEET_NAMES_MEMO[miss[i]] = names;
      put['sheetnames:' + miss[i]] = JSON.stringify(names);
    });
    try { cache.putAll(put, SHEET_NAMES_CACHE_SEC); } catch (e) { /* 覚えられなくても続ける */ }
  } catch (err) {
    console.warn('シートの名前を同時に調べられませんでした: ' + err);
  }
}

function clearSheetNamesCache_() {
  SHEET_NAMES_MEMO = null;
  const ids = [prop_(CFG.PROP.SS), prop_(CFG.PROP.B_SS), rosterId_()].filter(Boolean);
  try { CacheService.getScriptCache().removeAll(ids.map(id => 'sheetnames:' + id)); } catch (e) { /* 続ける */ }
}

/** 読むだけのときのシート（まとめて読んだ値を使う）。シートがなければ null。書き込むときは table_ を使う */
function readTable_(name) {
  if (!(name in VALUES_MEMO)) prefetch_([name]);
  const values = VALUES_MEMO[name];
  return values ? tableOf_(null, values) : null;
}

function cell_(v) {
  if (v instanceof Date) {
    const hasTime = v.getHours() || v.getMinutes();
    return Utilities.formatDate(v, CFG.TZ, hasTime ? 'yyyy/MM/dd HH:mm' : 'yyyy-MM-dd');
  }
  return v === null || v === undefined ? '' : String(v);
}

/** 見出しに無い列を右端に足す（コードの更新で列が増えたとき用） */
/** 名前を変えた列（古い見出し → 新しい見出し）。シートに古い見出しがあれば、その場で新しい見出しに書き換える */
const RENAMED_COLS = { '交通費_バス券': '交通費_ICカード' };
function renameHeaders_(sh, cur) {
  cur.forEach((h, j) => {
    const to = RENAMED_COLS[h];
    if (to && cur.indexOf(to) === -1) { sh.getRange(1, j + 1).setValue(to); cur[j] = to; }
  });
  return cur;
}

function ensureColumns_(t, headers) {
  if (t.headers.some(h => RENAMED_COLS[h])) {
    const before = t.headers.slice();
    t.headers = renameHeaders_(t.sh, t.headers.slice());
    // 読み込み済みの行も新しい名前で読めるようにする
    before.forEach((h, j) => { if (h !== t.headers[j]) (t.rows || []).forEach(r => { r[t.headers[j]] = r[h]; delete r[h]; }); });
  }
  const missing = headers.filter(h => t.headers.indexOf(h) === -1);
  if (!missing.length) return t;
  const start = t.headers.length + 1;
  t.sh.getRange(1, start, 1, missing.length).setValues([missing]).setFontWeight('bold').setBackground('#d9e7f5');
  t.headers = t.headers.concat(missing);
  return t;
}

function find_(t, id) {
  if (!id) return null;
  return t.rows.filter(r => r['申請ID'] === String(id))[0] || null;
}

function formOf_(key) {
  const form = FORMS[String(key || '')];
  if (!form) throw new Error('様式が見つかりません：' + str_(key, 20));
  return form;
}

/** 全様式のシートから届出を探す。見つかれば { form, t, rec }（rec._form に様式番号が入る） */
function findRecord_(id) {
  if (!id) return null;
  const keys = Object.keys(FORMS);
  prefetch_(dataSheetNames_());
  for (let i = 0; i < keys.length; i++) {
    const form = FORMS[keys[i]];
    const t = readTable_(form.sheet);
    const rec = t && find_(t, id);
    if (rec) {
      rec._form = form.key;
      // 書き込み用のシートは、書くときに初めて開く（見るだけならスプレッドシートを開かずに済む）
      let shMemo = null;
      Object.defineProperty(t, 'sh', {
        get: () => shMemo || (shMemo = sheetSs_(form.sheet).getSheetByName(form.sheet)),
        set: v => { shMemo = v; },
        configurable: true, enumerable: true
      });
      return { form: form, t: t, rec: rec };
    }
  }
  return null;
}

/** 全様式の届出（各行の _form に様式番号が入る）。シートをまだ作っていない様式は飛ばす */
function allRecords_() {
  const out = [];
  prefetch_(dataSheetNames_());
  Object.keys(FORMS).forEach(k => {
    const t = readTable_(FORMS[k].sheet);
    if (!t) return;
    t.rows.forEach(r => {
      r._form = k;
      out.push(r);
    });
  });
  return out;
}

/** 届出に付いているファイルすべて（添付ファイル＋様式ごとのファイル） */
function fileMetas_(form, rec) {
  return parseJson_(rec['添付ファイル'], []).concat(form.extraFiles ? form.extraFiles(rec) : []);
}

/** 1行を書き込む。数式として解釈されないよう、すべて書式なしテキストで保存する */
function writeRow_(t, rec) {
  VALUES_MEMO = {};
  if (isB_(rec)) {
    // スプレッドシートで読みやすい列（決裁の記録・添付ファイル名）を書き足す
    t = ensureColumns_(t, FORMS[rec._form].headers);
    rec['決裁の記録'] = routeText_(rec);
    rec['添付ファイル名'] = parseJson_(rec['添付ファイル'], []).map(f => f.name).join('、');
  }
  const arr = t.headers.map(h => (h && rec[h] !== undefined && rec[h] !== null) ? String(rec[h]) : '');
  let row = rec._row;
  if (!row) {
    row = t.sh.getLastRow() + 1;
    if (row > t.sh.getMaxRows()) t.sh.insertRowsAfter(t.sh.getMaxRows(), 50);
    rec._row = row;
  }
  t.sh.getRange(row, 1, 1, arr.length).setNumberFormat('@').setValues([arr]);
}

/** 何行も付く表（children）の、届出1件分の行。「順」の列があればその順に並べる */
function childRows_(form, name, id) {
  const def = form.children[name];
  const t = readTable_(def.sheet);
  return (t ? t.rows : [])
    .filter(r => r['申請ID'] === id)
    .sort((a, b) => Number(a['順'] || 0) - Number(b['順'] || 0))
    .map(r => {
      const o = {};
      def.headers.forEach(h => { o[h] = r[h] || ''; });
      return o;
    });
}

/** 何行も付く表の、届出1件分を書き直す（先頭の列は行ごとのID） */
function writeChildren_(form, name, id, rows) {
  VALUES_MEMO = {};
  const def = form.children[name];
  const t = ensureColumns_(table_(def.sheet), def.headers);
  // 古い行を消す：続いている行はまとめて消す（下から）
  const old = t.rows.filter(r => r['申請ID'] === id).map(r => r._row).sort((a, b) => b - a);
  for (let i = 0; i < old.length;) {
    let j = i;
    while (j + 1 < old.length && old[j + 1] === old[j] - 1) j++;
    t.sh.deleteRows(old[j], i === j ? 1 : j - i + 1);
    i = j + 1;
  }
  if (!rows.length) return;
  // 新しい行は、まとめて1回で書く
  const arrs = rows.map(r => {
    const o = Object.assign({ '申請ID': id }, r);
    o[def.headers[0]] = Utilities.getUuid();
    return t.headers.map(h => (h && o[h] !== undefined && o[h] !== null) ? String(o[h]) : '');
  });
  const start = t.sh.getLastRow() + 1;
  const end = start + arrs.length - 1;
  if (end > t.sh.getMaxRows()) t.sh.insertRowsAfter(t.sh.getMaxRows(), end - t.sh.getMaxRows() + 50);
  t.sh.getRange(start, 1, arrs.length, t.headers.length).setNumberFormat('@').setValues(arrs);
}

/** 何行も付く表ごとの、届出IDごとの行数 { 名前: { 申請ID: 行数 } } */
function childCounts_(form) {
  const out = {};
  Object.keys(form.children || {}).forEach(n => {
    out[n] = {};
    const t = readTable_(form.children[n].sheet);
    if (!t) return;
    t.rows.forEach(r => {
      out[n][r['申請ID']] = (out[n][r['申請ID']] || 0) + 1;
    });
  });
  return out;
}

function log_(id, action, email, stage, comment, formKey) {
  let sh = ss_().getSheetByName(CFG.SHEET.LOG);
  if (!sh) { sh = ss_().insertSheet(CFG.SHEET.LOG); clearSheetNamesCache_(); }
  // 見出しが足りなければ（「様式」の列を足す前のシートなど）書き直す
  if (sh.getLastColumn() < LOG_HEADERS.length) {
    sh.getRange(1, 1, 1, LOG_HEADERS.length).setValues([LOG_HEADERS]).setFontWeight('bold');
  }
  const row = sh.getLastRow() + 1;
  if (row > sh.getMaxRows()) sh.insertRowsAfter(sh.getMaxRows(), 100);
  sh.getRange(row, 1, 1, LOG_HEADERS.length).setNumberFormat('@')
    .setValues([[now_(), id, action, email, String(stage), comment || '', formKey || '']]);
}

/* =============================================================
 * マスタ（決裁者リスト＋決裁ルート）
 * ============================================================= */
function rosterId_() {
  return prop_(CFG.PROP.ROSTER) || CFG.ROSTER.ID;
}

function rosterSheet_() {
  const id = rosterId_();
  let ss;
  try {
    ss = SpreadsheetApp.openById(id);
  } catch (e) {
    throw new Error('決裁者リストを開けませんでした。オーナーのアカウントで決裁者リストを開けるか確認してください。');
  }
  return ss.getSheets()[0];
}

/**
 * 決裁者リストの値。別のスプレッドシートを開くのは時間がかかるので、数分だけ覚えておく
 * （CFG.ROSTER_CACHE_SEC。決裁者リストを直してから画面に反映されるまで、最大でこの時間かかる）。
 * fresh のときは必ず読み直す（メニューの「初期設定」「決裁者の確認」「再通知」）。
 */
let ROSTER_FETCHED = null;
function rosterValues_(fresh) {
  const cache = CacheService.getScriptCache();
  if (!fresh) {
    const hit = cache.get('roster_values');
    if (hit) return JSON.parse(hit);
  }
  // 覚えていなければ、届出などのシートと同時に読む（Sheets API）。読めなかったときだけ決裁者リストを開く
  ROSTER_FETCHED = null;
  tm_('マスタ：決裁者リストと届出などのシートを同時に読む', () => prefetch_(dataSheetNames_(), true));
  const values = ROSTER_FETCHED && ROSTER_FETCHED.length
    ? ROSTER_FETCHED.map(r => r.map(cell_))
    : tm_('マスタ：決裁者リストを開いて読む', () => rosterSheet_().getDataRange().getValues().map(r => r.map(cell_)));
  try { cache.put('roster_values', JSON.stringify(values), CFG.ROSTER_CACHE_SEC); } catch (e) { /* 大きすぎるときは覚えない */ }
  return values;
}

/** 役職名をそろえる：（兼務）などのかっこ書きと空白を取る（「サビ管（兼務）」→「サビ管」） */
function roleName_(v) {
  return String(v || '').replace(/[（(][^）)]*[）)]/g, '').replace(/[\s　]+/g, '').trim();
}

/** 決裁者リスト・決裁ルート・事業所住所をまとめて読む（1回の呼び出しの中では1度だけ読む） */
let MASTERS_MEMO = null;
function masters_(fresh) {
  if (MASTERS_MEMO && !fresh) return MASTERS_MEMO;
  return (MASTERS_MEMO = readMasters_(!!fresh));
}

function readMasters_(fresh) {
  const R = CFG.ROSTER;
  const roster = tableOf_(null, tm_('マスタ：決裁者リストを読む', () => rosterValues_(fresh)));
  [R.ROLE, R.NAME, R.EMAIL].forEach(h => {
    if (roster.headers.indexOf(h) === -1) throw new Error('決裁者リストに「' + h + '」の列がありません。');
  });

  const people = [];
  const staff = {};
  const offices = [];
  tm_('マスタ：決裁者リストを整える（' + roster.rows.length + '行）', () => roster.rows.forEach(r => {
    const email = lc_(r[R.EMAIL]);
    if (!email) return;
    const p = {
      email: email,
      name: String(r[R.NAME] || '').trim(),
      roles: String(r[R.ROLE] || '').split(R.ROLE_SEPARATOR).map(roleName_).filter(Boolean),
      offices: R.OFFICES.map(h => String(r[h] || '').trim()).filter(Boolean)
    };
    people.push(p);
    if (!staff[email]) {
      p.pid = pid_(email);
      staff[email] = p;
    }
    p.offices.forEach(o => {
      if (R.HQ.indexOf(o) === -1 && offices.indexOf(o) === -1) offices.push(o);
    });
  }));

  const flowDefs = {};
  tm_('マスタ：届出などのシートを読む', () => prefetch_(dataSheetNames_()));
  const flow = readTable_(CFG.SHEET.FLOW);
  if (!flow) throw new Error('「' + CFG.SHEET.FLOW + '」シートがありません。メニュー「届出アプリ」→「初期設定」を実行してください。');
  flow.rows.forEach(r => {
    const s = Number(r['段階']);
    if (!s) return;
    flowDefs[s] = {
      label: String(r['役割'] || '').trim(),
      rosterRole: String(r['名簿の役職'] || '').trim(),
      byOffice: String(r['所属事業所で絞る'] || '').trim() === 'はい'
    };
  });

  // 申請で選ぶ事業所：「事業所住所」シートの行（グループホームの各ホームなど）＋
  // シートに無い決裁者リストの所属。決裁者は「決裁者リストの所属」の人から探す。
  const rosterOffices = offices.slice();
  const officeAddress = {};
  const officeGroup = {};
  const listed = [];
  const addressTable = readTable_(CFG.SHEET.OFFICE_ADDRESS);
  if (addressTable) {
    addressTable.rows.forEach(r => {
      const name = String(r['事業所名'] || '').trim();
      if (!name || listed.indexOf(name) !== -1) return;
      listed.push(name);
      officeAddress[name] = str_(r['住所'], 300);
      officeGroup[name] = String(r['決裁者リストの所属'] || '').trim() || name;
    });
  }
  const covered = listed.map(n => officeGroup[n]);
  offices.length = 0;
  listed.concat(rosterOffices.filter(o => listed.indexOf(o) === -1 && covered.indexOf(o) === -1))
    .forEach(o => offices.push(o));

  // テスト運用中は、選べる事業所を「テスト運用」シートの事業所だけにする（決裁者リストの所属名で書いてもよい）
  const trial = readTrial_();
  if (trial && trial.offices.length) {
    const keep = offices.filter(o => trial.offices.indexOf(o) !== -1 || trial.offices.indexOf(officeGroup[o] || o) !== -1);
    offices.length = 0;
    keep.forEach(o => offices.push(o));
  }

  // 所属未定（採用前）は、いつも選べる（人事労務関連の書類だけ。画面と保存のときに、起案書などでは外す）
  offices.push(UNDECIDED_OFFICE);

  return {
    people: people, staff: staff, offices: offices, rosterOffices: rosterOffices,
    officeGroup: officeGroup, officeAddress: officeAddress, flowDefs: flowDefs, trial: trial
  };
}

/** 「テスト運用」シートの見出し（1行目）。A2 に「はい」と書くとテスト運用になる */
const TRIAL_HEADERS = ['テスト運用中（はい／いいえ）', '使える事業所', 'お知らせする人のメール', '申請できる人のメール（空なら法人の全員）'];

/**
 * テスト運用の設定。テスト運用でなければ null。
 * { offices: [事業所名], notify: [お知らせを送る人のメール], users: [アプリを使える人のメール（空なら全員）] }
 * お知らせは notify の人にだけ送る（Chat もメールも）。users を書いたときは、users と notify の人だけがアプリを使える。
 */
function readTrial_() {
  const t = readTable_(CFG.SHEET.TRIAL);
  if (!t || !t.rows.length || String(t.rows[0][TRIAL_HEADERS[0]] || '').trim() !== 'はい') return null;
  const col = h => t.rows.map(r => String(r[h] || '').trim()).filter(Boolean);
  const mails = h => col(h).map(lc_).filter(e => /@/.test(e));
  return { offices: col(TRIAL_HEADERS[1]), notify: mails(TRIAL_HEADERS[2]), users: mails(TRIAL_HEADERS[3]) };
}

function nameOf_(email, m) {
  const e = lc_(email);
  return (m.staff[e] && m.staff[e].name) || e;
}

function nameOrBlank_(email, m) {
  return email ? nameOf_(email, m) : '';
}

/* =============================================================
 * 添付ファイル
 * ============================================================= */
let FOLDER_MEMO = null;
function folder_() {
  if (FOLDER_MEMO) return FOLDER_MEMO;
  const props = PropertiesService.getScriptProperties();
  const id = props.getProperty(CFG.PROP.FOLDER);
  if (id) {
    try {
      const f = DriveApp.getFolderById(id);
      // 前の版の名前のままなら、新しい名前に変える（人が別の名前に変えていたら、そのままにする）
      if (CFG.OLD_FOLDER_NAMES.indexOf(f.getName()) !== -1) f.setName(CFG.FOLDER_NAME);
      return (FOLDER_MEMO = f);
    } catch (e) { /* 消されていたら作り直す */ }
  }
  const folder = DriveApp.createFolder(CFG.FOLDER_NAME);
  props.setProperty(CFG.PROP.FOLDER, folder.getId());
  return (FOLDER_MEMO = folder);
}

/** ファイル・フォルダの名前に使えない文字をよける */
function safeName_(v, max) {
  return str_(v, max || 100).replace(/[\\/:*?"<>|\r\n\t]/g, '_').trim();
}

/** その届出の申請者の名前（ファイル名に付ける） */
function applicantForFile_(rec) {
  return safeName_(rec['申請者氏名'], 40).replace(/[\s　]+/g, '') || '申請者';
}

/**
 * その届出のファイルを入れるフォルダ：添付ファイルのフォルダ ／ 書類の名前 ／ 提出日_申請者_届出番号。
 * なければ作る。届出番号（申請IDの最初の8文字）で探すので、名前が変わっても同じフォルダを使う
 */
const RECORD_FOLDER_MEMO = {};
function recordFolder_(rec, form) {
  const id8 = String(rec['申請ID'] || '').slice(0, 8);
  if (RECORD_FOLDER_MEMO[id8]) return RECORD_FOLDER_MEMO[id8];
  const root = folder_();
  const formName = safeName_(form ? form.title : '', 80) || 'その他';
  const it = root.getFoldersByName(formName);
  const formFolder = it.hasNext() ? it.next() : root.createFolder(formName);
  const found = formFolder.searchFolders("title contains '" + id8.replace(/'/g, '') + "'");
  if (found.hasNext()) return (RECORD_FOLDER_MEMO[id8] = found.next());
  const day = String(rec['申請日時'] || rec['作成日時'] || now_()).slice(0, 10).replace(/\//g, '-');
  return (RECORD_FOLDER_MEMO[id8] = formFolder.createFolder(day + '_' + applicantForFile_(rec) + '_' + id8));
}

function saveFile_(nf, rec, form) {
  const mime = String(nf.mime || '');
  if (!/^image\/(png|jpeg|gif|webp|heic|heif)$/.test(mime) && mime !== 'application/pdf') {
    throw new Error('添付できるのは画像（JPEG・PNGなど）とPDFだけです：' + str_(nf.name, 100));
  }
  const bytes = Utilities.base64Decode(String(nf.data || ''));
  if (bytes.length > CFG.MAX_FILE_MB * 1024 * 1024) {
    throw new Error('ファイルが大きすぎます（' + CFG.MAX_FILE_MB + 'MBまで）：' + str_(nf.name, 100));
  }
  const name = str_(nf.name, 120).replace(/[\\/]/g, '_') || 'file';
  // ドライブでは「申請者_元のファイル名」で保存する（アプリでは元のファイル名で表示する）
  const file = recordFolder_(rec, form).createFile(Utilities.newBlob(bytes, mime, applicantForFile_(rec) + '_' + safeName_(name, 120)));
  return { id: file.getId(), name: name, mime: mime };
}

function trash_(fileId) {
  try { DriveApp.getFileById(fileId).setTrashed(true); } catch (e) { console.warn('ファイルをゴミ箱に移せませんでした: ' + fileId); }
}

/* =============================================================
 * お知らせ（Google Chat のダイレクトメッセージ。送れない相手にはメール）
 * ============================================================= */
function notifyStage_(rec, m) {
  if (isB_(rec)) return notifyStageB_(rec, m);
  const s = Number(rec['段階']);
  const who = currentApprover_(rec, m);
  const applicant = rec['申請者氏名'] + '（' + rec['所属事業所'] + '）';
  if (!who) {
    // 担当者が名簿に無いと止まってしまうので、労務担当に知らせる
    notify_(laborEmails_(m), '【決裁停止】' + titleOf_(rec) + '（' + applicant + '）', [
      '段階' + s + '（' + roleOf_(s, m) + '）の担当者が決裁者リストに見つからないため、決裁が止まっています。',
      '決裁者リストを確認し、直したらスプレッドシートのメニュー「申請中の届出を今の担当者に再通知」を押してください。',
      '',
      '申請者：' + applicant
    ], rec['申請ID']);
    return;
  }
  notify_([who], '【決裁依頼】' + titleOf_(rec) + '（' + applicant + '）', [
    nameOf_(who, m) + ' さん',
    '',
    '届出の決裁をお願いします。',
    '',
    '申請者：' + applicant,
    'あなたの段階：' + s + '/' + CFG.STEP_COUNT + ' ' + roleOf_(s, m)
  ], rec['申請ID']);
}

/** グループB：今の段階でまだ承認していない人に1人ずつ知らせる（チーフが複数なら全員に） */
function notifyStageB_(rec, m, only) {
  const s = Number(rec['段階']);
  const route = routeOf_(rec);
  const st = route[s - 1];
  const applicant = rec['申請者氏名'] + '（' + rec['所属事業所'] + '）';
  if (!st) return;
  // 決裁者が異動・退職していたら、起案者に付け替えを頼む
  if (reassignNeeds_(rec, m).length) {
    notify_([rec['申請者メール']], '【決裁者の付け替えのお願い】' + titleOf_(rec), [
      rec['申請者氏名'] + ' さん',
      '',
      '提出した' + titleOf_(rec) + 'の決裁者に、決裁者リストにいない人（異動・退職など）がいます。',
      'このままでは決裁が進まないことがあります。アプリで届出を開き、「決裁者を付け替える」から付け替えてください。'
    ], rec['申請ID']);
  }
  currentApprovers_(rec, m).filter(who => m.staff[who] && (!only || only.indexOf(who) !== -1)).forEach(who => {
    notify_([who], '【決裁依頼】' + titleOf_(rec) + '（' + applicant + '）', [
      nameOf_(who, m) + ' さん',
      '',
      '決裁をお願いします。',

function notify_(to, subject, lines, recordId) {
  // テスト運用中は「お知らせする人」にだけ送る（ほかの人には Chat もメールも送らない）
  const trial = masters_().trial;
  const list = (to || []).map(lc_).filter((e, i, a) => e && a.indexOf(e) === i && (!trial || trial.notify.indexOf(e) !== -1));

/* -------------------------------------------------------------
 * Google Chat のダイレクトメッセージ
 * 送信元は Chatアプリ（bot）。サービスアカウントの鍵をスクリプト プロパティ
 * CHAT_SERVICE_ACCOUNT_JSON に入れると有効になる（設定は「セットアップ手順」参照）。
 * ------------------------------------------------------------- */

/** Chatアプリとして送るためのアクセストークン（55分キャッシュ） */
function chatAppToken_() {
  const key = parseJson_(PropertiesService.getScriptProperties().getProperty(CFG.PROP.CHAT_KEY), null);
  if (!key || !key.client_email || !key.private_key) return '';
  const cache = CacheService.getScriptCache();
  const hit = cache.get('chat_app_token');
  if (hit) return hit;
  const now = Math.floor(Date.now() / 1000);
  const b64 = o => Utilities.base64EncodeWebSafe(JSON.stringify(o)).replace(/=+$/, '');
  const unsigned = b64({ alg: 'RS256', typ: 'JWT' }) + '.' + b64({
    iss: key.client_email,
    scope: 'https://www.googleapis.com/auth/chat.bot',
    aud: 'https://oauth2.googleapis.com/token',
    exp: now + 3600,
    iat: now
  });
  const signature = Utilities.base64EncodeWebSafe(
    Utilities.computeRsaSha256Signature(unsigned, key.private_key)).replace(/=+$/, '');
  const res = UrlFetchApp.fetch('https://oauth2.googleapis.com/token', {
    method: 'post',
    payload: { grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: unsigned + '.' + signature },
    muteHttpExceptions: true
  });
  const body = parseJson_(res.getContentText(), {});
  if (res.getResponseCode() !== 200 || !body.access_token) {
    console.error('Chatアプリのトークンを取得できません: ' + res.getResponseCode() + ' ' + res.getContentText());
    return '';
  }
  cache.put('chat_app_token', body.access_token, 3000);
  return body.access_token;
}

function chatApi_(url, token, method, payload) {
  return UrlFetchApp.fetch(url, {
    method: method,
    headers: { Authorization: 'Bearer ' + token },
    contentType: 'application/json; charset=UTF-8',
    payload: payload ? JSON.stringify(payload) : null,
    muteHttpExceptions: true
  });
}

/**
 * その人の Chat のユーザーID（数字）。メールアドレスでは見つからないことがあるため、
 * 組織のディレクトリ（People API）で調べる。People API を追加していなければ空を返す。
 */
function chatUserId_(email) {
  const cache = CacheService.getScriptCache();
  const hit = cache.get('chat_uid:' + email);
  if (hit !== null) return hit === '-' ? '' : hit;
  let id = '';
  try {
    if (typeof People !== 'undefined') {
      const res = People.People.searchDirectoryPeople({
        query: email,
        readMask: 'emailAddresses',
        sources: ['DIRECTORY_SOURCE_TYPE_DOMAIN_PROFILE']
      });
      const person = (res.people || []).filter(p =>
        (p.emailAddresses || []).some(a => lc_(a.value) === email))[0];
      if (person) id = String(person.resourceName || '').replace('people/', '');
    }
  } catch (err) {
    console.warn('ユーザーIDを取得できません（' + email + '）: ' + err);
  }
  if (!/^\d+$/.test(id)) id = '';
  cache.put('chat_uid:' + email, id || '-', id ? 21600 : 600);
  return id;
}

/** その人とChatアプリのダイレクトメッセージの部屋（無ければ空文字） */
function chatDmSpace_(email, token) {
  const cache = CacheService.getScriptCache();
  const hit = cache.get('chat_dm:' + email);
  if (hit !== null) return hit === '-' ? '' : hit;
  // 数字のユーザーID → メールアドレス の順に試す
  const keys = [chatUserId_(email), email].filter(Boolean);
  let space = '';
  for (let i = 0; i < keys.length && !space; i++) {
    const res = chatApi_('https://chat.googleapis.com/v1/spaces:findDirectMessage?name=' +
      encodeURIComponent('users/' + keys[i]), token, 'get');
    if (res.getResponseCode() === 200) {
      space = String(parseJson_(res.getContentText(), {}).name || '');
    } else if (res.getResponseCode() !== 404) {
      console.warn('DMの部屋を取得できません（' + email + ' / ' + keys[i] + '）: ' +
        res.getResponseCode() + ' ' + res.getContentText());
    }
  }
  cache.put('chat_dm:' + email, space || '-', space ? 21600 : 120);
  return space;
}
/** ダイレクトメッセージを1人に送る。送れたら true */
function sendChatDm_(email, subject, lines, url, recordId) {
  if (!CFG.CHAT.ENABLED) return false;
  const token = chatAppToken_();
  if (!token) return false;
  try {
    const space = chatDmSpace_(email, token);
    if (!space) return false;
    const res = chatApi_('https://chat.googleapis.com/v1/' + space + '/messages', token, 'post',
      chatMessage_(subject, lines, url));
    if (res.getResponseCode() === 200) return true;
    console.error('Chat送信に失敗（' + email + '）: ' + res.getResponseCode() + ' ' + res.getContentText());
    try { log_(recordId || '', 'Chat送信に失敗（メールに切替）', email, '', String(res.getResponseCode())); } catch (e) { /* 続行 */ }
    return false;
  } catch (err) {
    console.error('Chat送信に失敗（' + email + '）: ' + err);
    return false;
  }
}

/** Chatに送るメッセージ（文章＋「アプリで開く」ボタン） */
function chatMessage_(subject, lines, url) {
  const text = '*' + subject + '*\n' + lines.filter(l => l !== '').join('\n');
  if (!url) return { text: text };
  return {
    text: text,
    cardsV2: [{
      cardId: 'open',
      card: {
        sections: [{
          widgets: [{
            buttonList: {
              buttons: [{ text: 'アプリで開く', onClick: { openLink: { url: url } } }]
            }
          }]
        }]
      }
    }]
  };
}

/** お知らせメール（Chatを送れない相手用） */
function sendMail_(to, subject, lines, url, recordId) {
  const list = (to || []).map(lc_).filter((e, i, a) => e && a.indexOf(e) === i);
  if (!list.length) return;
  const body = lines.concat(
    url ? ['', 'アプリで開く：', url] : [],
    ['', '――', CFG.MAIL.FOOTER]
  ).join('\n');
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const htmlBody = '<div style="font-family:sans-serif;font-size:14px;line-height:1.7">' +
    lines.map(l => l ? esc(l) : '&nbsp;').join('<br>') +
    (url ? '<p style="margin:20px 0"><a href="' + esc(url) + '" style="background:#1d4e89;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:bold">アプリで開く</a></p>' : '') +
    '<p style="color:#5f6b76;font-size:12px;border-top:1px solid #d5dbe1;padding-top:8px">' + esc(CFG.MAIL.FOOTER) + '</p></div>';
  try {
    // noReply：差出人を noreply@（法人のドメイン）にし、オーナー個人のアドレスを出さない
    MailApp.sendEmail({ to: list.join(','), subject: subject, body: body, htmlBody: htmlBody, name: CFG.MAIL.SENDER_NAME, noReply: true });
  } catch (err) {
    console.error('メール送信に失敗: ' + err);
    try { log_(recordId || '', 'メール送信に失敗', list.join(','), '', String(err)); } catch (e) { /* ログも書けなければ諦める */ }
  }
}

/** 旧版の「決裁者N_〜」列は、データが無ければ「承認者N」に名前を変える */
function migrateMainHeaders_(ss) {
  const sh = ss.getSheetByName(FORMS['7'].sheet);
  if (!sh || !sh.getLastColumn() || sh.getLastRow() > 1) return;
  const headers = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(h => String(h).trim());
  headers.forEach((h, i) => {
    const mt = h.match(/^決裁者(\d)_/);
    if (mt && headers.indexOf('承認者' + mt[1]) === -1) sh.getRange(1, i + 1).setValue('承認者' + mt[1]);
  });

function ensureSheet_(ss, name, headers, asText) {
  if (!ss.getSheetByName(name)) clearSheetNamesCache_();
  SHEET_NAMES_MEMO = null;
  VALUES_MEMO = {};
  const sh = ss.getSheetByName(name) || ss.insertSheet(name);
  const lastCol = sh.getLastColumn();
  const cur = renameHeaders_(sh, lastCol ? sh.getRange(1, 1, 1, lastCol).getValues()[0].map(h => String(h).trim()) : []);
  const missing = headers.filter(h => cur.indexOf(h) === -1);
  if (missing.length) sh.getRange(1, cur.length + 1, 1, missing.length).setValues([missing]);
  const n = cur.length + missing.length;
  sh.getRange(1, 1, 1, n).setFontWeight('bold').setBackground('#d9e7f5');
  sh.setFrozenRows(1);
  if (asText) sh.getRange(1, 1, sh.getMaxRows(), n).setNumberFormat('@');
  return sh;
}

/** 人事異動の後に、決裁者の抜け・重なりや、止まってしまう届出がないかを確認する */
function checkMasters() {
  const m = masters_(true);
  SpreadsheetApp.getUi().alert(masterProblems_(m).join('\n') || '問題は見つかりませんでした。\n\n' + routeSummary_(m));
}

function masterProblems_(m) {
  const problems = [];
  STEPS.forEach(s => {
    const def = m.flowDefs[s];
    if (!def || !def.rosterRole) {
      problems.push('・決裁ルート 段階' + s + ' の「名簿の役職」が空欄です。');
      return;
    }
    const targets = def.byOffice ? m.offices.filter(o => !isSkipped_(s, o, m)) : [''];
    targets.forEach(office => {
      // グループホームの各ホームなどは「決裁者リストの所属」（例：グループホーム）の人を探す
      const found = peopleWithRole_(def.rosterRole, office ? (m.officeGroup[office] || office) : '', m);
      const where = office ? '「' + office + '」の' : '';
      if (!found.length) problems.push('・' + where + '「' + def.rosterRole + '」が決裁者リストにいません。');
      if (found.length > 1) {
        problems.push('・' + where + '「' + def.rosterRole + '」が ' + found.length + ' 人います（' +
          found.map(e => nameOf_(e, m)).join('、') + '）。先頭の ' + nameOf_(found[0], m) + ' さんが決裁者になります。');
      }
    });
  });
  m.offices.filter(o => o !== UNDECIDED_OFFICE && !m.officeAddress[o])
    .forEach(o => problems.push('・「' + o + '」の住所が「事業所住所」シートにありません（通勤距離を測れません）。'));
  Object.keys(m.officeGroup).filter(o => m.rosterOffices.indexOf(m.officeGroup[o]) === -1 && CFG.ROSTER.HQ.indexOf(m.officeGroup[o]) === -1)
    .forEach(o => problems.push('・事業所住所シートの「' + o + '」の所属「' + m.officeGroup[o] + '」が決裁者リストにありません。'));
  // グループB（起案・物品購入等）で使う役職が名簿にあるか
  [B_ROLES.CHIEF, B_ROLES.CHAIRMAN].forEach(role => {
    if (!peopleWithRole_(role, '', m).length) problems.push('・「' + role + '」の人が決裁者リストにいません（起案・物品購入等の様式で使います）。');
  });
  // 事業所ごとに、サビ管・サビ責（児発管など）が見つからないところを、名簿にある役職名と一緒に出す
  m.offices.filter(o => !isHq_(o, m)).forEach(o => {
    const group = m.officeGroup[o] || o;
    if (bCandidates_('sabikan', o, m).emails.length) return;
    const roles = uniq_(m.people.filter(p => p.offices.indexOf(group) !== -1).reduce((a, p) => a.concat(p.roles), []));
    problems.push('・「' + o + '」にサビ管・サビ責（' + B_ROLES.SABIKAN.join('／') + '）がいません。' +
      '決裁者リストでこの事業所にある役職：' + (roles.join('、') || 'なし'));
  });
  if (!m.people.some(p => p.roles.some(r => B_ROLES.DIRECTOR.test(r)))) {
    problems.push('・「〇〇部長」の人が決裁者リストにいません（起案書の部長の選択肢になります）。');
  }
  allRecords_()
    .filter(r => r['申請ID'] && (stuck_(r, m) || reassignNeeds_(r, m).length))
    .forEach(r => problems.push('・申請中の届出（' + titleOf_(r) + '・' + r['申請者氏名'] + '・' + r['所属事業所'] + '）' +
      (isB_(r) ? 'の決裁者に、異動・退職などで外れた人がいます。起案者が「決裁者を付け替える」で付け替えられます（メニュー「申請中の届出を今の担当者に再通知」で起案者にお願いが届きます）。'
        : 'が「' + statusLabel_(r, m) + '」で止まっています。')));
  return problems.length ? ['確認が必要な点が ' + problems.length + ' 件あります。', ''].concat(problems) : [];
}

function routeSummary_(m) {
  const global = STEPS.filter(s => !(m.flowDefs[s] || {}).byOffice)
    .map(s => roleOf_(s, m) + '：' + nameOrBlank_(approverFor_(s, '', m), m)).join(' → ');
  const perOffice = m.offices.map(o => '・' + o + '：' + STEPS.filter(s => (m.flowDefs[s] || {}).byOffice)
    .map(s => roleOf_(s, m) + ' ' + (isSkipped_(s, o, m) ? '（対象外）' : nameOrBlank_(approverFor_(s, o, m), m))).join(' → ')).join('\n');
  return '【事業所ごと】\n' + perOffice + '\n\n【本部】\n' + global;
}

    'このスプレッドシートの元のシートは「移動済み_〇〇」という名前で残します。よろしいですか？', ui.ButtonSet.OK_CANCEL);
  if (ok !== ui.Button.OK) return;
  withLock_(() => {
    const main = ss_();
    const dest = SpreadsheetApp.create(CFG.B_SS_NAME);
    const first = dest.getSheets()[0];
    let moved = 0;
    Object.keys(FORMS).filter(k => FORMS[k].group === 'B').forEach(k => {

      const parts = [{ sheet: form.sheet, headers: form.headers }]
        .concat(Object.keys(form.children || {}).map(n => form.children[n]));
      parts.forEach(part => {
        const sh = ensureSheet_(dest, part.sheet, part.headers, true);

        if (!old) return;
        const values = old.getDataRange().getValues();
        const oldHeaders = (values[0] || []).map(h => String(h).trim());
        const headers = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(h => String(h).trim());
        // 列の並びが違っても、見出しの名前で合わせて写す
        const rows = values.slice(1).filter(r => r.some(v => v !== '')).map(r => headers.map(h => {
          const j = oldHeaders.indexOf(h);
          return j === -1 ? '' : cell_(r[j]);
        }));
        if (rows.length) {
          sh.getRange(2, 1, rows.length, headers.length).setNumberFormat('@').setValues(rows);
          moved += rows.length;
        }
        old.setName('移動済み_' + part.sheet);

/** 毎朝トリガーから呼ばれる。止まっている届出の、今の番の人に知らせる */
function remindPending() {
  const now = new Date();
  const dow = Number(Utilities.formatDate(now, CFG.TZ, 'u'));   // 1＝月 … 7＝日
  if (dow >= 6) return;
  const m = masters_(true);
  const props = PropertiesService.getScriptProperties();
  const saved = props.getProperties();
  const dayMs = 24 * 60 * 60 * 1000;
  const keep = {};
  allRecords_().filter(r => r['申請ID'] && r['ステータス'] === '申請中').forEach(rec => {
    const who = currentApprovers_(rec, m).filter(e => m.staff[e]);
    const since = stageStartedAt_(rec);
    if (!who.length || !since) return;
    // 段階が進んだら数え直すように、届出と段階ごとに覚える
    const key = 'remind:' + rec['申請ID'] + ':' + rec['段階'];
    keep[key] = true;
    const last = saved[key] ? new Date(Number(saved[key])) : since;
    if (now - last < CFG.REMIND.AFTER_DAYS * dayMs - 60 * 60 * 1000) return;   // 少しの時刻のずれは許す
    const days = Math.floor((now - since) / dayMs);
    const applicant = rec['申請者氏名'] + '（' + rec['所属事業所'] + '）';
    const label = stageLabel_(rec, Number(rec['段階']), m);
    who.forEach(email => {
      notify_([email], '【催促】決裁をお願いします：' + titleOf_(rec) + '（' + applicant + '）', [
        nameOf_(email, m) + ' さん',
        '',
        'あなたの決裁の番が来てから ' + days + ' 日たっています。',
        'アプリで内容を確認し、承認または差し戻しをお願いします。',
        '',
        '申請者：' + applicant,
        'あなたの段階：' + label
      ], rec['申請ID']);
    });
    props.setProperty(key, String(now.getTime()));
    log_(rec['申請ID'], '催促（' + label + '）', who.join(','), rec['段階'], days + '日経過', rec._form);
  });
  // 決裁が進んだ・終わった届出の記録は消す
  Object.keys(saved).filter(k => k.indexOf('remind:') === 0 && !keep[k]).forEach(k => props.deleteProperty(k));
}

/** 今の段階が始まった日時（前の段階の最後の承認、なければ提出の日時）。読めなければ null */
function stageStartedAt_(rec) {
  const s = Number(rec['段階']);
  let times = [];
  if (isB_(rec)) {
    const prev = routeOf_(rec)[s - 2];
    if (prev) times = Object.keys(prev.at || {}).map(e => prev.at[e]);
  } else {
    for (let x = s - 1; x >= 1 && !times.length; x--) {
      if (rec[APPROVED_AT_COLS[x - 1]]) times = [rec[APPROVED_AT_COLS[x - 1]]];
    }
  }
  const dates = times.concat(times.length ? [] : [rec['申請日時']]).map(parseDateTime_).filter(Boolean);
  return dates.length ? new Date(Math.max.apply(null, dates.map(d => d.getTime()))) : null;
}

/** 「yyyy/MM/dd HH:mm」などの日時を Date に（読めなければ null） */
function parseDateTime_(v) {
  const x = String(v || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})(?:\D+(\d{1,2}):(\d{2}))?/);
  return x ? new Date(Number(x[1]), Number(x[2]) - 1, Number(x[3]), Number(x[4] || 0), Number(x[5] || 0)) : null;
}

<script>
(function () {

  const S = { boot: null, lists: null, tab: 'mine', record: null, form: null, formFilter: '' };

  /* ---------- 共通 ---------- */
  function h(v) {

      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

    const args = Array.prototype.slice.call(arguments, 1);

        .withSuccessHandler(resolve)

    });
  }

  let busyCount = 0;
  function busy(on, text) {
    busyCount += on ? 1 : -1;
    document.getElementById('busy-text').textContent = text || '処理中…';
    document.getElementById('busy').hidden = busyCount <= 0;
  }

  async function call(text, fn) {
    busy(true, text);
    let res;
    try {
      res = await fn();
    } catch (err) {
      // 「処理中…」を先に消す（残したままだとエラーの［OK］が押せない）
      busy(false);
      await dialog({ title: 'エラー', body: '<div class="alert back">' + h(err.message) + '</div>', cancel: false });
      throw err;
    }
    busy(false);
    return res;
  }

  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 3500);
  }

  /** モーダル。OKで本文内の入力値 {name: value} を返し、キャンセルで null を返す */
  function dialog(o) {
    return new Promise(function (resolve) {
      const ov = document.createElement('div');
      ov.className = 'overlay';
      ov.innerHTML = '<div class="modal ' + (o.large ? 'large' : '') + '" role="dialog" aria-modal="true">' +
        '<h3>' + h(o.title) + '</h3><div class="modal-body">' + (o.body || '') + '</div>' +
        '<div class="actions">' +
        (o.cancel === false ? '' : '<button class="btn" data-x="cancel">' + h(o.cancelLabel || 'キャンセル') + '</button>') +
        (o.ok === false ? '' : '<button class="btn ' + (o.okClass || 'primary') + '" data-x="ok">' + h(o.okLabel || 'OK') + '</button>') +
        '</div></div>';
      function close(val) { ov.remove(); resolve(val); }
      ov.addEventListener('click', function (e) {
        const x = e.target.getAttribute('data-x');

        if (x === 'ok') {

  function wareki(d) {
    const m = String(d || '').match(/^(\d{4})[-\/](\d{1,2})(?:[-\/](\d{1,2}))?/);
    if (!m) return '';
    const y = Number(m[1]);
    // 年月日を数値にして元号の始まりと比べる（年月だけのときは月初）
    const key = y * 10000 + Number(m[2]) * 100 + (m[3] ? Number(m[3]) : 1);
    const eras = [[20190501, '令和', 2018], [19890108, '平成', 1988], [19261225, '昭和', 1925], [19120730, '大正', 1911]];
    const e = eras.filter(function (x) { return key >= x[0]; })[0];
    if (!e) return y + '年' + Number(m[2]) + '月' + (m[3] ? Number(m[3]) + '日' : '');
    const n = y - e[2];
    return e[1] + (n === 1 ? '元' : n) + '年' + Number(m[2]) + '月' + (m[3] ? Number(m[3]) + '日' : '');

    // 決裁者用のタブは、決裁者（決裁者リストに載っている人）か、実際に決裁する・した届出がある人にだけ出す
    if (S.boot.isApprover || L.pending.length || L.involved.length) {
      defs.push({ key: 'pending', label: '決裁する届出（決裁者用）', count: L.pending.length });
      defs.push({ key: 'involved', label: '決裁に関わる届出（決裁者用）' });
    }
    if (S.boot.isLabor) defs.push({ key: 'all', label: '労務担当の届出（すべて）' });
    if (S.boot.history) defs.push({ key: 'history', label: '事業所の履歴' });
    return defs;
  }

  function renderTabs() {
    document.getElementById('tabs').innerHTML = tabDefs().map(function (t) {
      return '<button class="tab" role="tab" data-tab="' + t.key + '" aria-selected="' + (S.tab === t.key) + '">' +
        h(t.label) + (t.count ? '<span class="count">' + t.count + '</span>' : '') + '</button>';
    }).join('');
  }

  document.getElementById('tabs').addEventListener('click', async function (e) {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    if (S.form && S.form.dirty && !(await confirmLeave())) return;
    const key = btn.getAttribute('data-tab');
    if (key === 'new') { openPicker(); return; }
    S.tab = key;
    renderTabs();
    // 手元の一覧ですぐに表示し、最新の一覧は裏で取りに行く
    renderList();
    refreshListsBg();
  });

  async function confirmLeave() {
    const ok = await dialog({ title: '入力中の内容があります', body: '<p>保存していない入力内容は消えます。移動してよろしいですか？</p>', okLabel: '移動する', okClass: 'danger' });
    if (ok) S.form = null;
    return !!ok;
  }

  async function refreshLists() {
    S.lists = await call('読み込み中…', function () { return api('getLists'); });
    renderTabs();
  }

  /**
   * 最新の一覧を裏で取りに行く（画面は止めない）。取れたら、一覧を見ているときだけ表示し直す。
   * 入力中（検索欄など）や、届出を開いている・入力画面のときは、表示し直さない
   */
  function refreshListsBg() {
    const tab = S.tab;
    return api('getLists').then(function (lists) {
      S.lists = lists;
      renderTabs();
      prefetchRecords();
      if (S.form || S.record || S.tab !== tab || tab === 'new') return;
      const el = document.activeElement;
      if (tab === 'history') { renderHistoryList(); return; }
      if (el && view.contains(el) && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      const y = window.scrollY;
      renderList();
      window.scrollTo(0, y);
    }).catch(function () { /* 裏の読み込みに失敗しても、手元の一覧のまま使える */ });
  }

  /* ---------- 一覧 ---------- */
  function formInfo(key) {
    return S.boot.forms.filter(function (x) { return x.key === key; })[0] || { key: key, title: '様式' + key, code: '' };
  }

  /** 一覧の1件 */
  function itemCard(r) {
    return '<div class="card item" role="button" tabindex="0" data-open="' + h(r.id) + '">' +
      '<div><div class="form-tag">' + h(r.formTitle || formInfo(r.form).title) + '</div>' +
      '<div class="name">' + h(r.name) + '<span class="meta">　' + h(r.office) + '</span></div>' +
      '<div class="kinds">' + (r.kinds.length ? r.kinds.map(function (k) { return '<span>' + h(k) + '</span>'; }).join('') : '<span class="meta">（未入力）</span>') + '</div></div>' +
      '<div style="text-align:right"><span class="badge ' + badgeClass(r.status) + '">' + h(r.status) + '</span>' +
      '<div class="meta' + (r.unassigned ? ' unassigned' : '') + '">' + h(r.status === '申請中' ? r.statusLabel : '') + '</div>' +
      '<div class="meta">' + (r.submittedAt ? '提出 ' + h(r.submittedAt) : '更新 ' + h(r.updatedAt)) + '</div>' +
      (r.doneAt ? '<div class="meta">決裁完了 ' + h(r.doneAt) + '</div>' : '') + '</div>' +
      (r.progress.length ? stepper(r.progress, true) : '') +
      '</div>';
  }

  function renderList() {
    S.form = null;
    S.record = null;
    if (S.tab === 'history') { renderHistory(); return; }
    const titles = {
      mine: ['自分の届出一覧', 'まだ届出がありません。「＋ 新しく届け出る」から作成してください。'],
      pending: ['決裁する届出（決裁者用）', 'あなたの決裁を待っている届出はありません。'],
      involved: ['決裁に関わる届出（決裁者用）', 'あなたが決裁した届出・これから決裁する届出はまだありません。'],
      all: ['労務担当の届出（すべて）', '提出済みの届出はありません。']
    };
    const t = titles[S.tab] || titles.mine;
    const all = S.lists[S.tab] || [];
    // 様式で絞り込む（「全部」は空文字）
    if (S.formFilter && !S.boot.forms.some(function (x) { return x.key === S.formFilter; })) S.formFilter = '';
    const rows = S.formFilter ? all.filter(function (r) { return r.form === S.formFilter; }) : all;
    const chip = function (key, label) {
      const n = key ? all.filter(function (r) { return r.form === key; }).length : all.length;
      return '<button type="button" class="chip" data-act="filter" data-form="' + h(key) + '" aria-pressed="' + ((S.formFilter || '') === key) + '">' +
        h(label) + '<span class="chip-count">' + n + '</span></button>';
    };
    view.innerHTML =
      '<div class="page-head"><h2>' + h(t[0]) + '</h2>' +
      (S.tab === 'mine' ? '<button class="btn primary" data-act="new">＋ 新しく届け出る</button>' : '') + '</div>' +
      (S.tab === 'all' ? '<p class="note" style="margin:-4px 0 10px">労務担当が決裁に入る届出を、全員分表示しています（起案書・物品購入伺書・旅費請求書は出ません）。</p>' : '') +
      (S.tab === 'pending' ? '<p class="note" style="margin:-4px 0 10px">あなたの決裁の順番が来ている届出です。開いて「承認する」か「差し戻す」を選んでください。</p>' : '') +
      (S.tab === 'involved' ? '<p class="note" style="margin:-4px 0 10px">あなたがすでに決裁した届出と、これから決裁の順番が来る届出です。自分で出した届出は「自分の届出一覧」で見られます。</p>' : '') +
      '<div class="chips" role="group" aria-label="様式で絞り込む">' + chip('', '全部') +
      // 様式が多いので、この一覧に届出がある様式だけを並べる
      S.boot.forms.filter(function (x) { return x.key === S.formFilter || all.some(function (r) { return r.form === x.key; }); })
        .map(function (x) { return chip(x.key, x.title); }).join('') + '</div>' +
      (rows.length ? '<div class="list">' + rows.map(itemCard).join('') + '</div>'
        : '<div class="card empty">' + h(all.length ? 'この様式の届出はありません。' : t[1]) + '</div>');
  }

  /* ---------- 事業所の履歴（起案・物品購入等。管理者・事務員は自分の事業所、総務部長は全事業所。
     人事労務関連の書式は管理者・事務員の自分の事業所の分） ---------- */
  S.hf = { kind: '', form: '', office: '', status: '', from: '', to: '', q: '' };
  function isBRow(r) { return isBForm(formInfo(r.form)); }

  function historyRows() {
    const f = S.hf;
    const q = f.q.trim().toLowerCase();
    return (S.lists.history || []).filter(function (r) {
      const day = String(r.submittedAt || '').slice(0, 10).replace(/\//g, '-');
      return (!f.kind || (f.kind === 'B') === isBRow(r)) && (!f.form || r.form === f.form) && (!f.office || r.office === f.office) && (!f.status || r.status === f.status) &&
        (!f.from || day >= f.from) && (!f.to || day <= f.to) &&
        (!q || [r.name, r.office, r.formTitle, r.subject].concat(r.kinds).join(' ').toLowerCase().indexOf(q) !== -1);
    });
  }

  function renderHistory() {
    const H = S.boot.history || { offices: [] };
    const f = S.hf;
    const labor = (H.laborOffices || []).length > 0;
    const hasB = H.all || H.offices.length > 0;
    const offices = H.offices.concat((H.laborOffices || []).filter(function (o) { return H.offices.indexOf(o) === -1; }));
    // 様式の絞り込みには、履歴に出てくる様式だけを並べる
    const used = {};
    (S.lists.history || []).forEach(function (r) { used[r.form] = true; });
    const forms = S.boot.forms.filter(function (x) {
      return used[x.key] && (!f.kind || (f.kind === 'B') === isBForm(x));
    });
    const what = (hasB ? '起案書・物品購入（修繕）伺書・旅費請求（精算）領収証など' : '') +
      (hasB && labor ? 'と、' : '') + (labor ? '人事労務関連の届出' : '');
    const sel = function (key, label, list) {
      return '<div class="field"><label>' + h(label) + '</label><select data-hf="' + key + '"><option value="">すべて</option>' +
        list.map(function (v) { return '<option value="' + h(v[0]) + '"' + (f[key] === v[0] ? ' selected' : '') + '>' + h(v[1]) + '</option>'; }).join('') + '</select></div>';
    };
    view.innerHTML =
      '<div class="page-head"><h2>事業所の履歴</h2>' +
      '<button class="btn" data-act="history-csv">CSVで書き出す</button></div>' +
      '<p class="note">' + (H.all ? '全事業所' : h(offices.join('・'))) + 'の' + what + 'です（下書きは出ません）。' +
      (H.all && labor ? '人事労務関連の届出は、' + h(H.laborOffices.join('・')) + 'の分だけです。' : '') +
      '開くと中身・添付ファイル・決裁の記録を見られます。</p>' +
      '<section class="card section"><div class="grid">' +
      (hasB && labor ? sel('kind', '区分', [['B', '起案・物品購入など'], ['labor', '人事労務関連']]) : '') +
      sel('form', '様式', forms.map(function (x) { return [x.key, (x.code ? x.code + ' ' : '') + x.title]; })) +
      (offices.length > 1 ? sel('office', '事業所', offices.map(function (o) { return [o, o]; })) : '') +
      sel('status', '状態', [['申請中', '申請中'], ['決裁完了', '決裁完了'], ['差戻し', '差戻し']]) +
      '<div class="field"><label>提出日（から）</label><input type="date" data-hf="from" value="' + h(f.from) + '"></div>' +
      '<div class="field"><label>提出日（まで）</label><input type="date" data-hf="to" value="' + h(f.to) + '"></div>' +
      '<div class="field"><label>キーワード</label><input type="text" data-hf="q" value="' + h(f.q) + '" placeholder="件名・起案者・申請者など"></div>' +
      '</div></section>' +
      '<div id="history-list"></div>';
    renderHistoryList();
  }

  function renderHistoryList() {
    const box = document.getElementById('history-list');
    if (!box) return;
    const rows = historyRows();
    const total = rows.reduce(function (a, r) { return a + (Number(r.amount) || 0); }, 0);
    const anyB = rows.some(isBRow);
    box.innerHTML = rows.length
      ? '<p class="note">' + rows.length + ' 件' + (anyB ? '　金額の合計 ' + yen(total) + ' 円' : '') + '</p><div class="list">' + rows.map(itemCard).join('') + '</div>'
      : '<div class="card empty">' + ((S.lists.history || []).length ? '条件に合う届出はありません。' : 'まだ届出はありません。') + '</div>';
  }

  /** 絞り込んだ一覧を CSV（Excel で開ける形）で書き出す */
  function historyCsv() {
    const rows = historyRows();
    const cell = function (v) { return '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"'; };
    const lines = [['様式', '起案者', '所属事業所', '件名・内容', '金額', '状態', '今の決裁', '提出日時', '決裁完了日時'].map(cell).join(',')]
      .concat(rows.map(function (r) {
        return [r.formTitle, r.name, r.office, r.subject, r.amount, r.status, r.status === '申請中' ? r.statusLabel : '', r.submittedAt, r.doneAt].map(cell).join(',');
      }));
    // 先頭の BOM で、Excel でも文字化けしないようにする
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '事業所の履歴_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  view.addEventListener('input', function (e) {
    const key = e.target.getAttribute && e.target.getAttribute('data-hf');
    if (!key) return;
    S.hf[key] = e.target.value;
    // 区分を変えたら、様式の選択肢も並べ直す
    if (key === 'kind') { S.hf.form = ''; renderHistory(); return; }
    renderHistoryList();
  });

  view.addEventListener('keydown', function (e) {
    const open = e.target.closest('[data-open]');
    if (open && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      openRecord(open.getAttribute('data-open'));
    }
  });

  view.addEventListener('click', function (e) {
    // Googleマップ（閲覧のみ）：開くときにも、経路を動かしても届出は変わらないことを知らせる
    const mapsLink = e.target.closest('[data-maps-view]');
    if (mapsLink) { e.preventDefault(); openMapsView(mapsLink.getAttribute('href')); return; }
    const open = e.target.closest('[data-open]');
    if (open) { openRecord(open.getAttribute('data-open')); return; }
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const name = act.getAttribute('data-act');
    const handlers = {
      'new': function () { openPicker(); },
      'back': backToList,
      'edit': function () { openForm(S.record); },
      'print': function () { window.print(); },
      'approve': doApprove,
      'reassign': doReassign,
      'history-csv': historyCsv,
      'reject': doReject,
      'process': doProcess,
      'set-office': doSetOffice,
      'confirm-office': doConfirmOffice,
      'jump-process': function () { const c = document.getElementById('process-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
      'delete': doDelete,
      'view-file': function () { viewFile(act.getAttribute('data-id')); },
      'add-route': addRoute,
      'measure': function () { measureCommute(true); },
      'pick-route': function () { pickRoute(Number(act.getAttribute('data-i'))); },
      'via-route': viaRoute,
      'reset-route': function () { setRouteChoice({ type: 'shortest' }); },
      'toggle-back': function () { toggleBack(act.checked); },
      'back-via': function () { backVia(false); },
      'back-shortest': function () { backVia(true); },
      'remove-route': function () { removeRoute(Number(act.getAttribute('data-i'))); },
      'remove-file': function () { removeFile(act.getAttribute('data-id')); },
      'save': function () { saveForm(false); },
      'submit': function () { saveForm(true); },
      'cancel-form': cancelForm,
      'filter': function () { S.formFilter = act.getAttribute('data-form') || ''; renderList(); },
      'pick-parent': function () { togglePickParent(act.getAttribute('data-parent')); },
      'pick-tab': function () { openPicker(null, act.getAttribute('data-group'), true); },
      'pick-new': function () { openForm(null, act.getAttribute('data-form')); },
      'back-picker': backToPicker,
      'add-item': addItem,
      'add-row': function () { addRow(act.getAttribute('data-t')); },
      'remove-row': function () { removeRow(act.getAttribute('data-t'), Number(act.getAttribute('data-i'))); },
      'remove-item': function () { removeItem(Number(act.getAttribute('data-i'))); },
      'add-leg': addLeg,
      'add-trip': addTrip,
      'remove-trip': function () { removeTrip(Number(act.getAttribute('data-i'))); },
      'remove-leg': function () { removeLeg(Number(act.getAttribute('data-i'))); },
      'measure-leg': function () { measureLeg(Number(act.getAttribute('data-i'))); },
      'yahoo-leg': function () { openYahoo(Number(act.getAttribute('data-i'))); },
      'add-dep': addDependent,
      'add-career': addCareer,
      'remove-career': function () { removeCareer(Number(act.getAttribute('data-i'))); },
      'new-form': function () { openForm(null, act.getAttribute('data-form')); },
      'remove-dep': function () { removeDependent(Number(act.getAttribute('data-i'))); }
    };
    if (handlers[name]) handlers[name]();
  });

  async function backToList() {
    renderList();
    window.scrollTo(0, 0);
    refreshListsBg();
  }

  /* ---------- 詳細（届出書） ---------- */
  // 一度開いた届出は手元に覚えておき、次に開くときはすぐに表示する（最新の内容は裏で取りに行く）
  const REC_CACHE = {};
  async function openRecord(id) {
    const hit = REC_CACHE[id];
    if (hit) {
      showRecord(hit);
      api('getRecord', id).then(function (fresh) {
        const same = JSON.stringify(fresh) === JSON.stringify(hit);
        REC_CACHE[id] = fresh;
        if (same || !S.record || S.record.id !== id || S.form) return;
        const el = document.activeElement;
        if (el && view.contains(el) && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
        showRecord(fresh, { keepScroll: true });
      }).catch(function () { /* 手元の内容のまま */ });
      return;
    }
    let rec;
    try {
      rec = await call('読み込み中…', function () { return api('getRecord', id); });
    } catch (err) {
      renderList();
      return;
    }
    showRecord(rec);
  }

  function showRecord(rec, opts) {
    S.record = rec;
    if (rec && rec.id) REC_CACHE[rec.id] = rec;
    S.form = null;
    const f = rec.fields;
    const P = rec.perms;
    const ui = FORM_UI[rec.form];

    const actionBtns = [];
    if (P.approve) {
      actionBtns.push('<button class="btn ok" data-act="approve">承認する</button>');
      actionBtns.push('<button class="btn danger" data-act="reject">差し戻す</button>');
    }
    if (P.setOffice) actionBtns.push('<button class="btn primary" data-act="set-office">所属事業所を決める</button>');
    if (P.confirm) actionBtns.push('<button class="btn ok" data-act="confirm-office">確認しました</button>');
    if (P.edit) actionBtns.push('<button class="btn primary" data-act="edit">' + (f['ステータス'] === '差戻し' ? '修正して再提出' : '編集・提出') + '</button>');
    if (P.remove) actionBtns.push('<button class="btn danger" data-act="delete">下書きを削除</button>');
    const needsReassign = (rec.reassign || []).length > 0;
    if (needsReassign) actionBtns.unshift('<button class="btn primary" data-act="reassign">決裁者を付け替える</button>');
    actionBtns.push('<button class="btn" data-act="print">印刷</button>');

    view.innerHTML =
      '<div class="bar no-print"><button class="btn" data-act="back">← 一覧へ戻る</button>' +
      '<span class="badge ' + badgeClass(f['ステータス']) + '">' + h(rec.statusLabel) + '</span></div>' +
      (f['ステータス'] === '差戻し' ? '<div class="alert back no-print"><b>差し戻されました</b>（' + h(f['差戻し者']) + '）\n' + h(f['差戻し理由']) + '</div>' : '') +
      (f['ステータス'] === '下書き' ? '<div class="alert info no-print">まだ提出されていません。「編集・提出」から内容を確認して提出してください。</div>' : '') +
      (needsReassign ? '<div class="alert back no-print"><b>決裁者の付け替えが必要です。</b>\n決裁者のうち ' +
        h(rec.reassign.map(function (n) { return n.label + '（' + n.bad.join('・') + '）'; }).join('、')) +
        ' が、異動・退職などで決裁者リストの担当から外れています。「決裁者を付け替える」から新しい決裁者を選んでください。</div>' : '') +
      (rec.form === '7' && usesMyCar(rec.routes) && lc(f['申請者メール']) === lc(S.boot.me) && FORM_UI['10']
        ? '<div class="alert info no-print">自動車・バイクで通勤する場合は、様式10（私有自動車〔マイカー〕の通勤使用申請書）も必要です。' +
          '<div style="margin-top:8px"><button class="btn small primary" data-act="new-form" data-form="10">様式10を作成する</button></div></div>'
        : '') +
      (P.setOffice ? '<div class="alert info no-print">採用前に出された届出です（所属未定）。所属事業所が決まったら「所属事業所を決める」を押してください。' +
        'その事業所の事務員・管理者に、確認のお知らせが届きます。</div>' : '') +
      (P.confirm ? '<div class="alert info no-print">所属が決まった職員の、採用前の届出です。内容を確認して「確認しました」を押してください（決裁はすでに進んでいます）。</div>' : '') +
      '<div class="actions no-print" style="margin-bottom:12px">' + actionBtns.join('') + '</div>' +
      // 処理内容の入力欄は一番下。上には、そこへ飛べる案内だけを出す
      (P.process && ui && ui.processBody
        ? '<div class="alert info no-print process-jump">✎ ' + h(ui.processTitle || '処理内容') + 'の入力欄は、このページの<b>一番下</b>にあります。' +
          '<button type="button" class="btn small" data-act="jump-process">入力欄へ移動 ↓</button></div>'
        : '') +
      (f['ステータス'] !== '下書き'
        ? '<section class="card progress-card no-print"><div class="progress-head">決裁の進み具合：' + h(rec.statusLabel) + '</div>' + stepper(rec.approvals, false) + '</section>'
        : '') +
      (ui ? ui.doc(rec) : '<div class="card empty">この様式（' + h(rec.formTitle) + '）の表示はまだ用意されていません。</div>') +
      (P.process && ui && ui.processBody ? processCard(rec, ui) : '');

    if (!(opts && opts.keepScroll)) window.scrollTo(0, 0);
    view.querySelectorAll('.image-holder').forEach(function (holder) { loadImage(rec, holder); });
  }

  /** 経路地図・略図を読み込んで表示する（PDFはボタンで開く） */
  async function loadImage(rec, holder) {
    const fileId = holder.getAttribute('data-file');
    try {
      const file = await api('getFile', rec.id, fileId);
      if (S.record !== rec || !holder.isConnected) return;
      if (/^image\//.test(file.mime)) {
        holder.outerHTML = '<img class="sketch-img" alt="' + h(holder.getAttribute('data-alt')) + '" src="data:' + h(file.mime) + ';base64,' + file.data + '">';
      } else {
        holder.innerHTML = '<div class="file"><span class="fname">' + h(file.name) + '</span><button class="btn small" data-act="view-file" data-id="' + h(fileId) + '">表示</button></div>';
      }
    } catch (err) {
      holder.textContent = '画像を読み込めませんでした：' + err.message;
    }
  }

  function base64ToBlob(data, mime) {
    const bin = atob(data);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  async function viewFile(fileId) {
    const rec = S.record;
    const file = await call('ファイルを読み込み中…', function () { return api('getFile', rec.id, fileId); });
    const url = URL.createObjectURL(base64ToBlob(file.data, file.mime));
    const pdf = file.mime === 'application/pdf';
    // PDF はアプリの枠の中では Chrome が表示を止める（ブロックされる）ため、PDF.js で絵にして表示する
    const body = /^image\//.test(file.mime)
      ? '<img alt="' + h(file.name) + '" src="' + url + '">'
      : pdf ? '<div id="pdf-view" class="pdf-view"><p class="note">PDFを表示しています…</p></div>'
      : '<iframe title="' + h(file.name) + '" src="' + url + '"></iframe>';
    const shown = dialog({
      title: file.name, large: true, ok: false, cancelLabel: '閉じる',
      body: body + '<p class="note" style="margin-top:8px"><a href="' + url + '" download="' + h(file.name) + '">ダウンロード</a></p>'
    });
    if (pdf) renderPdf(file.data, document.getElementById('pdf-view'));
    await shown;
    URL.revokeObjectURL(url);
  }

  /* PDF.js（cdnjs）を読み込む。動かす部品（worker）は同じ場所から取って、ブラウザの中で動かす */
  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  let pdfjsLoading = null;
  function loadPdfjs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (pdfjsLoading) return pdfjsLoading;
    pdfjsLoading = new Promise(function (resolve, reject) {
      const js = document.createElement('script');
      js.src = PDFJS + 'pdf.min.js';
      js.onload = function () {
        fetch(PDFJS + 'pdf.worker.min.js').then(function (r) { return r.text(); }).then(function (code) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
          resolve(window.pdfjsLib);
        }).catch(function () {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
          resolve(window.pdfjsLib);
        });
      };
      js.onerror = function () { pdfjsLoading = null; reject(new Error('PDFを表示する部品を読み込めませんでした')); };
      document.head.appendChild(js);
    });
    return pdfjsLoading;
  }

  async function renderPdf(base64, box) {
    if (!box) return;
    try {
      const lib = await loadPdfjs();
      const bin = atob(base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const doc = await lib.getDocument({ data: bytes }).promise;
      box.innerHTML = '';
      for (let n = 1; n <= doc.numPages; n++) {
        const page = await doc.getPage(n);
        const width = Math.max(320, box.clientWidth || 700);
        const base = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: (width / base.width) * (window.devicePixelRatio || 1) });
        const canvas = document.createElement('canvas');
        canvas.width = vp.width;
        canvas.height = vp.height;
        canvas.style.width = '100%';
        box.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      }
    } catch (err) {
      box.innerHTML = '<p class="note unassigned">PDFをここに表示できませんでした（' + h(err.message || err) + '）。下の「ダウンロード」から保存して開いてください。</p>';
    }
  }
