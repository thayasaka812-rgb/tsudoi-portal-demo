<!doctype html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<title>つどいの家 電子申請 体験版</title>
<style>
  :root {
    --ink: #1f2933;
    --muted: #5f6b76;
    --line: #d5dbe1;
    --soft: #f3f5f7;
    --paper: #ffffff;
    --ground: #eef1f4;
    --accent: #1d4e89;
    --accent-soft: #e3ecf6;
    --ok: #1e7b4f;
    --ok-soft: #e1f3ea;
    --warn: #9a5b00;
    --warn-soft: #fdf0d9;
    --ng: #b3261e;
    --ng-soft: #fbe5e3;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.6 "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 48px; }

  /* ヘッダー・タブ */
  .topbar { background: var(--accent); color: #fff; }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 700; }
  .topbar .who { font-size: 13px; opacity: .9; }
  .tabs { background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .tabs .wrap { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 0; }
  .tab { border: 0; background: none; padding: 12px 14px; cursor: pointer; white-space: nowrap; color: var(--muted); border-bottom: 3px solid transparent; }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .tab .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: var(--ng); color: #fff; font-size: 12px; line-height: 20px; text-align: center; }

  /* 共通 */
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 20px 0 12px; flex-wrap: wrap; }
  .page-head h2 { margin: 0; font-size: 19px; }
  .btn { border: 1px solid var(--line); background: var(--paper); padding: 9px 16px; border-radius: 8px; cursor: pointer; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }
  .btn.danger { color: var(--ng); border-color: #e7b8b4; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  .note { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .badge.draft { background: var(--soft); color: var(--muted); }
  .badge.wait { background: var(--warn-soft); color: var(--warn); }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  .badge.back { background: var(--ng-soft); color: var(--ng); }
  .alert { padding: 12px 14px; border-radius: 8px; margin-bottom: 12px; white-space: pre-wrap; }
  .alert.back { background: var(--ng-soft); color: var(--ng); }
  .alert.info { background: var(--accent-soft); color: var(--accent); }

  /* 一覧 */
  .list { display: grid; gap: 8px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 16px; cursor: pointer; text-align: left; width: 100%; }
  .item:hover, .item:focus-visible { border-color: var(--accent); outline: none; }
  .item .name { font-weight: 700; }
  .item .meta { color: var(--muted); font-size: 13px; }
  .item .kinds span { display: inline-block; margin-right: 6px; padding: 0 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }

  /* 入力フォーム */
  .section { padding: 18px 18px 8px; margin-bottom: 12px; }
  .section h3 { margin: 0 0 4px; font-size: 16px; color: var(--accent); }
  .section > .note { margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 16px; }
  .field { margin-bottom: 12px; }
  .field.wide { grid-column: 1 / -1; }
  .field label, .field .label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .req::after { content: "必須"; margin-left: 6px; padding: 0 5px; border-radius: 3px; background: var(--ng-soft); color: var(--ng); font-size: 11px; font-weight: 700; }
  input[type=text], input[type=tel], input[type=date], input[type=month], input[type=number], input[type=time], input[type=datetime-local], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  textarea { min-height: 80px; resize: vertical; }
  .choices { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .choices label { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; font-size: 14.5px; cursor: pointer; }
  .choices input { width: 18px; height: 18px; }
  .route { border: 1px solid var(--line); border-radius: 8px; padding: 12px 12px 0; margin-bottom: 10px; background: var(--soft); }
  .route-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 700; }
  .files { display: grid; gap: 6px; margin: 8px 0 12px; }
  .file { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: 14px; }
  .file .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .new { color: var(--ok); font-size: 12px; margin-left: 6px; }
  .form-foot { position: sticky; bottom: 0; background: rgba(238,241,244,.95); padding: 12px 0; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); }

  /* 届出書（詳細・印刷） */
  .doc { padding: 28px 28px 20px; }
  .doc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .doc-no { font-size: 12.5px; color: var(--muted); }
  .doc h2 { text-align: center; font-size: 20px; letter-spacing: .12em; margin: 8px 0 18px; }
  .doc-to { margin-bottom: 8px; }
  .doc-date { text-align: right; }
  .doc-lead { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 10px 0 14px; }
  .doc-lead dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; min-width: 260px; }
  .doc-lead dt { color: var(--muted); }
  .doc-lead dd { margin: 0; font-weight: 700; }
  .doc h4 { margin: 18px 0 6px; font-size: 15px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .doc h4 small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .scroll { overflow-x: auto; }
  table.form { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.form th, table.form td { border: 1px solid #9aa5b1; padding: 6px 8px; vertical-align: top; }
  table.form th { background: var(--soft); font-weight: 700; white-space: nowrap; text-align: center; vertical-align: middle; }
  table.form td.num { text-align: right; white-space: nowrap; }
  table.routes { min-width: 640px; }
  .checks span { display: inline-block; margin-right: 14px; white-space: nowrap; }
  .foot-notes { font-size: 12px; color: var(--muted); margin: 4px 0 0; padding-left: 1.2em; }
  .stamps { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(92px, 1fr)); border: 1px solid #9aa5b1; min-width: 560px; }
  .stamp { border-left: 1px solid #9aa5b1; text-align: center; font-size: 12.5px; }
  .stamp:first-child { border-left: 0; }
  .stamp .role { background: var(--soft); border-bottom: 1px solid #9aa5b1; padding: 4px 2px; font-weight: 700; }
  .stamp .box { min-height: 74px; padding: 6px 4px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .stamp .seal { display: inline-block; margin: 0 auto; padding: 2px 8px; border: 2px solid var(--ng); color: var(--ng); border-radius: 6px; font-weight: 700; }
  .stamp .when { color: var(--muted); font-size: 11.5px; }
  .stamp.current { background: var(--warn-soft); }
  .unassigned { color: var(--ng) !important; font-weight: 700; }
  .route-preview { padding: 10px 12px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line); }
  .route-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; counter-reset: step; }
  .route-steps li { display: inline-flex; flex-direction: column; padding: 4px 10px; background: #fff; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; line-height: 1.35; counter-increment: step; }
  /* 決裁の進み具合 */
  .stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 0; }
  .stepper li { position: relative; text-align: center; padding: 0 2px; min-width: 0; }
  .stepper li::before { content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
  .stepper li:first-child::before { display: none; }
  .stepper li.done::before, .stepper li.current::before { background: var(--ok); }
  .stepper .dot { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 2px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 700; }
  .stepper li.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
  .stepper li.current .dot { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }
  .stepper li.unassigned .dot { border-color: var(--ng); color: var(--ng); }
  .stepper li.skipped .dot { border-style: dashed; color: var(--muted); background: var(--soft); }
  .route-steps li.skipped { background: var(--soft); border-style: dashed; }
  .stepper .s-label { display: block; font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.3; overflow-wrap: anywhere; }
  .stepper .s-name { display: block; font-size: 12.5px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .stepper .s-at { display: block; font-size: 11px; color: var(--muted); }
  .stepper li.current .s-at { color: var(--warn); font-weight: 700; }
  .stepper.compact .s-name, .stepper.compact .s-at { display: none; }
  .stepper.compact .dot { width: 22px; height: 22px; font-size: 11px; }
  .stepper.compact li::before { top: 10px; }
  .item .stepper { grid-column: 1 / -1; margin-top: 8px; }
  .progress-card { padding: 16px 12px 12px; margin-bottom: 12px; }
  .progress-card .progress-head { font-weight: 700; margin: 0 4px 12px; }
  @media (max-width: 560px) {
    .stepper:not(.compact) { grid-template-columns: 1fr; gap: 8px; }
    .stepper:not(.compact) li { display: grid; grid-template-columns: 32px 1fr; text-align: left; align-items: center; column-gap: 8px; }
    .stepper:not(.compact) li::before { display: none; }
    .stepper:not(.compact) .dot { grid-row: 1 / span 3; }
    .stepper:not(.compact) .s-label { margin-top: 0; }
  }
  .route-change { border-top: 1px dashed var(--line); margin-top: 12px; }
  .route-options { display: grid; gap: 6px; }
  .cm-map { height: 380px; border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; position: relative; z-index: 0; }
  .cm-map .leaflet-interactive.cm-line { cursor: grab; }
  .cm-pin { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .cm-pin.o { background: #1e7b4f; } .cm-pin.h { background: #b3261e; } .cm-pin.v { background: #e8710a; cursor: move; }
  .cm-status { position: absolute; left: 8px; top: 8px; z-index: 1000; background: rgba(255,255,255,.95); border-radius: 6px; padding: 4px 10px; font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .maps-warn { margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: #fff4e5; border: 1px solid #f0b46a; color: #6b3a00; font-size: 13px; line-height: 1.6; }
  .maps-warn small { color: #6b3a00; }
  .leg-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 4px; font-size: 13.5px; }
  .process-card { border: 2px solid #f0b46a; background: #fffaf2; margin-top: 16px; }
  .process-jump { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .process-card h3 { color: #8a4b00; }
  .map-band { border: 2px solid #1d4e89; border-radius: 8px; padding: 8px 12px; margin: 6px 0 8px; background: #f3f7fc; font-size: 13px; line-height: 1.7; }
  .map-band .map-km { font-size: 15px; } .map-band .map-km b { font-size: 22px; margin: 0 4px 0 8px; color: #1d4e89; }
  @media print { .map-band { background: #fff; } }
  .pdf-view { max-height: 70vh; overflow: auto; background: #eee; padding: 6px; border-radius: 6px; }
  .pdf-view canvas { display: block; background: #fff; margin: 0 auto 8px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .choices label.trial-off { color: #9aa3ab; background: #f1f3f5; cursor: not-allowed; }
  .trial-note { color: #8a4b00; }
  .loading-card { display: flex; align-items: center; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 18px 0 12px; }
  .sk { display: block; background: linear-gradient(90deg, #e9edf1 25%, #f4f6f8 50%, #e9edf1 75%); background-size: 400% 100%; animation: sk 1.4s ease infinite; border-radius: 8px; }
  .sk-tab { display: inline-block; width: 110px; height: 18px; margin: 14px 10px 12px 0; vertical-align: middle; }
  .sk-line { height: 20px; margin: 18px 0 12px; }
  .sk-card { height: 72px; margin-bottom: 10px; }
  @keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .refresh-note { position: fixed; right: 12px; bottom: 12px; z-index: 50; background: rgba(31,41,51,.85); color: #fff; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; }
  .debug-timing { position: fixed; left: 8px; bottom: 8px; z-index: 60; max-width: 92vw; max-height: 45vh; overflow: auto; background: rgba(255,255,255,.97); border: 1px solid #999; border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .debug-timing table { border-collapse: collapse; margin-top: 4px; }
  /* 公務旅行伺い：スマホでは1件ずつのカード、パソコンと印刷では表 */
  .koumu-cards { display: none; }
  .koumu-card { margin-bottom: 8px; }
  @media (max-width: 640px) { .koumu-wide { display: none; } .koumu-cards { display: block; } }
  @media print { .koumu-wide { display: block !important; } .koumu-cards { display: none !important; } }
  .debug-timing th { text-align: left; background: #eef3f8; padding: 2px 6px; }
  .debug-timing td { padding: 1px 6px; border-bottom: 1px solid #eee; }
  .debug-timing td.num { white-space: nowrap; text-align: right; }
  .debug-timing .dbg-toggle { float: right; margin-left: 8px; font-size: 12px; padding: 1px 8px; }
  .debug-timing.folded table { display: none; }
  .trial-band { background: #fff4e5; color: #8a4b00; border-bottom: 1px solid #f0b46a; text-align: center; font-size: 13px; font-weight: 700; padding: 4px 8px; }
  .cm-tools { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .cm-tool { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 6px; border: 1px solid #bbb; background: #fff; color: #1d4e89; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.25); white-space: nowrap; }
  .cm-tool:disabled { color: #aaa; cursor: default; box-shadow: none; }
  .cm-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .cm-legend i { display: inline-block; width: 22px; height: 0; border-top: 4px solid #1d4e89; vertical-align: middle; margin-right: 4px; }
  .cm-legend i.s { border-top: 3px dashed #888; }
  .route-changed { display: inline-block; background: #fff4e5; color: #8a4b00; border: 1px solid #f0b46a; border-radius: 999px; padding: 1px 10px; font-size: 12.5px; font-weight: 700; }
  .route-option { display: grid; grid-template-columns: 20px 96px 1fr; gap: 10px; align-items: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; font-weight: 400; }
  .route-option.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .route-option img { width: 96px; height: 63px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
  .route-option input { width: 18px; height: 18px; }
  .via-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .via-row input { flex: 1 1 220px; }
  .route-role { color: var(--muted); font-size: 11.5px; }
  .route-role::before { content: counter(step) ". "; }
  .route-name { font-weight: 700; }
  .stamp.current .when { color: var(--warn); font-weight: 700; }
  .sketch-img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; display: block; margin-top: 6px; }
  /* 様式のタブ（新しく届け出る）・一覧の絞り込み */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .chip-count { display: inline-block; margin-left: 6px; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--soft); color: var(--muted); font-size: 11.5px; line-height: 18px; text-align: center; }
  .chip[aria-pressed="true"] .chip-count { background: rgba(255,255,255,.25); color: #fff; }
  .attach-slot { padding: 10px 0; border-top: 1px dashed var(--line); }
  .attach-slot:first-of-type { border-top: 0; }
  ol.conditions { margin: 0 0 8px; padding-left: 1.6em; font-size: 14px; }
  ol.conditions li { margin-bottom: 4px; }
  table.careers tbody.career tr:first-child td { border-top: 2px solid #5f6b76; }
  table.careers td { font-size: 13.5px; }
  .qual-table td { vertical-align: middle; }
  .qual-table input[type=checkbox] { width: 20px; height: 20px; }
  .qual-table input[type=date] { min-width: 150px; }
  .qual-table input:disabled { background: var(--soft); color: var(--muted); }
  .qual-table tr.on td { background: var(--accent-soft); }
  .item .form-tag { font-size: 12px; color: var(--accent); font-weight: 700; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 16px 0 12px; }
  /* グループB：決裁者を選ぶ欄 */
  .rt-stage { display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; padding: 8px 0; border-top: 1px dashed var(--line); }
  .rt-stage:first-child { border-top: 0; padding-top: 0; }
  .rt-stage .rt-no { grid-row: 1 / span 2; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; }
  .rt-stage.off .rt-no { background: var(--line); color: var(--muted); }
  .rt-stage.off .rt-body > :not(.rt-none) { opacity: .45; }
  .rt-head { font-size: 14px; }
  .rt-body select { max-width: 360px; }
  .field label.rt-none, .modal label.rt-none { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 13.5px; font-weight: 400; cursor: pointer; }
  .rt-none input { width: 16px; height: 16px; }
  .rt-summary { margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--line); }
  .items-table { min-width: 560px; }
  .items-table td { vertical-align: middle; padding: 4px 6px; }
  .items-table input { padding: 6px 8px; }
  .items-table .num { text-align: right; white-space: nowrap; }
  .sum-line { display: flex; justify-content: flex-end; gap: 16px; flex-wrap: wrap; margin: 6px 0 12px; font-size: 14px; }
  .sum-line b { font-size: 16px; }

  /* モーダル・通知 */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,32,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: #fff; border-radius: 12px; width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 20px; }
  .modal.large { width: min(900px, 100%); }
  .modal h3 { margin: 0 0 10px; font-size: 17px; }
  .modal .actions { justify-content: flex-end; margin-top: 16px; }

 * 新しい様式を足すときは、ここに1つ追加し、メニュー「初期設定」でシートを作る。
 *
 *   key           様式番号（文字列）
 *   code / title  書式番号と名前（画面・印刷・お知らせに出す）
 *   sheet         届出を保存するシート名
 *   headers       そのシートの列（申請ID・承認者・更新日時などの共通の列も含める）
 *   children      1件の届出に何行も付く表 { 名前: { sheet, headers, clean(list) } }
 *                 画面とのやり取りでは payload[名前]・record[名前] に行の配列が入る
 *   singleFiles   1つだけ付けるファイルの種類と、保存する列 { kind: 列名 }（それ以外は「添付ファイル」列）
 *   cleanFields   (入力, masters) → シートに書く値
 *   validate      (届出, children, masters) → エラー文の配列（決裁者の抜けは共通でチェックする）
 *   measure/apply 提出時にサーバーで計算する値があれば（様式7の通勤距離）
 *   processFields 労務担当が入力する処理内容の列。cleanProcess で整形する（空なら処理内容のボタンを出さない）
 *   clerkProcess  true なら、届出の事業所の事務員（①の段階の人）も処理内容を入力できる
 *                 紙の処理欄に受理日・処理日があれば headers に AUTO_DATE_COLS を入れる（アプリが自動で入れる）
 *   kinds         一覧に出す届出の内容（例：住所変更・通勤手当）
 *   extraFiles    「添付ファイル」列以外に届出に付いているファイル（閲覧・削除のため）
 *   viewExtras    画面に渡す、その様式だけの値
 *   requireConfirm 提出に「記載の内容に相違ないことを確認しました」のチェックが要る（押印の代わり）。
 *                 headers に「届出の確認」の列を入れる
 *   confirmLabel  確認のチェックの文（省略すると「記載の内容に相違ないことを確認しました」）
 *   attachSlots   書類ごとの添付欄 [{ key, label, required: 足りないときのエラー文（任意の欄は省略） }]
 *                 ファイルは「添付ファイル」列に slot（＝key）を付けて保存する。欄に当てはまらないものは「その他」
 *   requireFiles  提出に添付ファイルが1つ以上要るときの、足りない場合のエラー文
 * ============================================================= */

/** 選択肢 list のどれか（それ以外は空） */

  const s = String(v || '').trim();

}

/* =============================================================
 * 人事労務の様式（法人労務様式整理簿の分類ごと）
 * 項目の一覧（fields）から、シートの列・入力の整形・提出時のチェックを作る。
 * 画面（index.html の simpleUi）も同じ一覧から作るので、様式を足すときは defineSimple_ を1つ書くだけでよい。
 * 決裁の流れは、すべて採用・人事関係と同じ（決裁ルートシート：事務員→管理者→労務担当①②→総務部長→理事長）。
 * シートは、その様式が初めて保存されたときに作る（使わない様式のシートを増やさないため）。
 *
 *   spec  { key, group, code, title, lead, fields, table, attachSlots, requireFiles, confirmLabel, kinds, validate, docTo, docLead }
 *   項目  { key: 列名, label, type, options, req, max, wide, hint, show: [項目の列名, [値…]], after: この日付より後の項目 }
 *         type: text（省略時）/ area / date / month / time / datetime / number / money / tel / radio / select / checks / check
 *               heading（見出し。保存しない）/ note（説明文。保存しない。届出書にも出す）
 *         req: true か、足りないときのエラー文
 *         show: ほかの項目がその値のときだけ出す（出ていない項目は保存しない）
 *   table { label, cols: [項目…], max, min, hint, show } … 何行も付く表（シート「様式名_表の名前」）
 *   tables [table…] … 表が2つ以上あるとき（1つ目は画面とのやり取りで rows、2つ目から rows2・rows3…）
 *   docTo 届出書の宛先 { keys: [列名…], suffix }（省略時は理事長）。法人から職員に出す通知は対象職員
 *   attachSlots の when: [列名, [値…]] … その値のときだけ required にする
 * ============================================================= */
const SIMPLE_HEAD = ['申請ID', '作成日時', '申請者メール', '申請者氏名', '所属事業所', 'ステータス', '段階'];
const SIMPLE_TAIL = ['届出の確認', '添付ファイル'].concat(AUTO_DATE_COLS, APPROVED_BY_COLS, APPROVED_AT_COLS,
  ['申請日時', '差戻し理由', '差戻し者', '更新日時']);
const SIMPLE_NO_STORE = ['heading', 'note'];

/** 項目 f がいま出ているか（show の条件を満たすか） */
function shown_(f, rec) {
  if (!f.show) return true;
  const cur = String(rec[f.show[0]] || '').split('、');
  return f.show[1].some(v => cur.indexOf(v) !== -1);
}

/** 1つの値を項目の種類に合わせて整える */
function simpleValue_(f, v) {
  const time = s => /^([01]\d|2[0-3]):[0-5]\d$/.test(String(s || '')) ? String(s) : '';
  switch (f.type) {
    case 'area': return str_(v, f.max || 2000);
    case 'date': return date_(v);
    case 'month': return month_(v);
    case 'time': return time(v);
    case 'datetime': return dateTime_(v);
    case 'number': {
      const s = hankaku_(v).replace(/[,，\s]/g, '');
      return /^\d{1,7}(\.\d{1,2})?$/.test(s) ? String(Number(s)) : '';
    }
    case 'money': return money_(v);
    case 'tel': return hankaku_(str_(v, 30));
    case 'radio':
    case 'select': return f.options.indexOf(String(v || '')) !== -1 ? String(v) : '';
    case 'checks': return pickList_(v, f.options);
    case 'check': return v === true || v === 'はい' ? 'はい' : '';
    default: return str_(v, f.max || 200);
  }
}

/** エラー文に出す項目名（見出しの下の項目は「見出し：項目名」） */
function simpleLabel_(f) {
  return (f._sec ? f._sec + '：' : '') + f.label;
}

/** 入力が要るのに空の項目・順番が逆の期間を調べる */
function simpleErrors_(list, rec, prefix) {
  const errs = [];
  list.forEach(f => {
    if (!shown_(f, rec)) return;
    const v = rec[f.key];
    if (f.req && v === '') {
      const choose = ['radio', 'select', 'checks'].indexOf(f.type) !== -1;
      errs.push(typeof f.req === 'string' ? prefix + f.req
        : prefix + '「' + simpleLabel_(f) + '」を' + (f.type === 'check' ? '確認してチェックを入れて' : choose ? '選んで' : '入力して') + 'ください。');
    }
    if (f.after && v && rec[f.after] && v < rec[f.after]) {
      errs.push(prefix + '「' + simpleLabel_(f) + '」が「' + simpleLabel_(list.filter(x => x.key === f.after)[0] || { label: f.after }) + '」より前になっています。');
    }
  });
  return errs;
}

/** 項目の一覧から様式を作って FORMS に入れる */
function defineSimple_(spec) {
  let sec = '';
  const fields = spec.fields.map(f => {
    const o = Object.assign({ type: 'text' }, f);
    if (o.type === 'heading') sec = o.label;
    else o._sec = sec;
    return o;
  });
  const inputs = fields.filter(f => SIMPLE_NO_STORE.indexOf(f.type) === -1);
  const tables = (spec.tables || (spec.table ? [spec.table] : [])).map((t, i) =>
    Object.assign({}, t, { name: i ? 'rows' + (i + 1) : 'rows', cols: t.cols.map(c => Object.assign({ type: 'text' }, c)) }));
  if (uniq_(inputs.map(f => f.key)).length !== inputs.length) throw new Error('様式「' + spec.title + '」の項目の列名が重なっています。');
  const form = {
    key: spec.key,
    group: spec.group,
    code: spec.code || '',
    title: spec.title,
    sheet: spec.sheet || spec.title,
    headers: SIMPLE_HEAD.concat(inputs.map(f => f.key), SIMPLE_TAIL),
    lazySheet: true,
    requireConfirm: true,
    confirmLabel: spec.confirmLabel || '',
    attachSlots: spec.attachSlots || [],
    requireFiles: spec.requireFiles || '',
    // 画面に渡す項目の定義（index.html の simpleUi が使う）
    simple: {
      lead: spec.lead || '',
      docLead: spec.docLead || '',
      docTo: spec.docTo || null,
      fields: fields.map(f => { const o = Object.assign({}, f); delete o._sec; return o; }),
      tables: tables
    },
    cleanFields: (src, m) => {
      const out = applicant_(src, m);
      // 前の項目の値で出る・出ないが決まるので、並び順に整える
      inputs.forEach(f => { out[f.key] = shown_(f, out) ? simpleValue_(f, src[f.key]) : ''; });
      return out;
    },
    validate: (rec, children, m) => {
      const errs = applicantErrors_(rec).concat(simpleErrors_(inputs, rec, ''));
      tables.filter(t => shown_(t, rec)).forEach(t => {
        const rows = children[t.name] || [];
        if (t.min && rows.length < t.min) errs.push(t.label + 'を' + t.min + '行以上入力してください。');
        rows.forEach(r => { errs.push.apply(errs, simpleErrors_(t.cols, r, t.label + ' ' + (r._n || r['順']) + ' 行目：')); });
      });
      return spec.validate ? errs.concat(spec.validate(rec, children, m)) : errs;
    },
    processFields: [],
    kinds: (rec, counts) => {
      const out = (spec.kinds || []).map(k => {
        const f = inputs.filter(x => x.key === k)[0];
        const v = rec[k];
        if (!v || !f) return '';
        const head = f.short !== undefined ? f.short : (/^(date|datetime|month)$/.test(f.type) ? f.label : '');
        return ((head ? head + ' ' : '') + v.replace(/^(\d{4}-\d{2}-\d{2})T/, '$1 ')).slice(0, 40);
      }).filter(Boolean);
      tables.forEach(t => { if (counts[t.name]) out.push(t.label + ' ' + counts[t.name] + '件'); });
      return out;
    }
  };
  if (tables.length) {
    form.children = {};
    tables.forEach(t => {
      form.children[t.name] = {
        sheet: form.sheet + '_' + t.label,
        headers: ['明細ID', '申請ID', '順'].concat(t.cols.map(c => c.key)),
        clean: list => cleanSimpleRows_(t, list)
      };
    });
    // 表が出ていない（show の条件に合わない）ときは、表の行を保存しない
    form.derive = (rec, children) => { tables.forEach(t => { if (!shown_(t, rec)) children[t.name] = []; }); };
  }
  FORMS[spec.key] = form;
  return form;
}

/**
 * 項目の一覧から作った様式（defineSimple_）を、起案・物品購入等（グループB）の決裁の流れで回すようにする。
 * route は B の段階の並び（例：FORMS['buppin'].route）。画面では「日常業務関連」（opt.menu で変えられる）に出し、様式番号は出さない。
 */
function asBForm_(form, route, opt) {
  const inputs = form.headers.filter(h => SIMPLE_HEAD.indexOf(h) === -1 && SIMPLE_TAIL.indexOf(h) === -1);
  // opt.menu：画面で出す区分（省略すると「日常業務関連」。人事労務関連の区分に置いたままにするときに使う）
  form.menu = (opt && opt.menu) || 'daily';
  form.group = 'B';
  form.code = '';
  form.route = route.map(r => Object.assign({}, r));
  form.headers = B_HEAD.concat(inputs, B_TAIL);
  return form;
}

/** 何行も付く表の行を整える（全部空の行は捨てる） */
function cleanSimpleRows_(table, list) {
  return (list || []).slice(0, table.max || 31).map((r, i) => {
    // _n は画面の行番号（エラー文に使う。シートには書かない）
    const o = { _n: i + 1 };

function doGet(e) {
  const t = HtmlService.createTemplateFromFile('index');
  t.initialId = String((e && e.parameter && e.parameter.id) || '').replace(/[^\w-]/g, '');
  t.appTitle = CFG.APP_TITLE;
  t.brandOrg = CFG.BRAND.ORG;
  t.brandName = CFG.BRAND.NAME;
  // 前に開いたときの一覧など（その人の分）が覚えてあれば、ページと一緒に送って、すぐに表示する。
  // 最新の内容は、画面を出したあとに取りに行って入れ替える（getStartup）。覚えていなければ、画面の枠だけ先に出す
  TIMING = [];
  const t0 = Date.now();
  const cached = tm_('doGet：前回の内容を読む', () => cachedStartup_(lc_(Session.getActiveUser().getEmail())));
  // ページの script タグの中に書くので、閉じタグの文字で途切れないように < を書き換える
  const safe = v => JSON.stringify(v).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  t.startup = cached ? safe({ ok: cached, cached: true }) : 'null';
  // 計測モード（URL に ?debug=1）：サーバーの時間を画面に出す
  const debug = !!(e && e.parameter && e.parameter.debug);
  const html = tm_('doGet：ページを組み立てる', () => {
    t.debug = debug ? safe({ doGet: TIMING.slice(), doGetTotal: Date.now() - t0 }) : 'null';
    return t.evaluate();
  });
  return html.setTitle(CFG.APP_TITLE).addMetaTag('viewport', 'width=device-width, initial-scale=1');
}

/** 起動時にまとめて1回で返す（別々に呼ぶと、マスタやシートを2回ずつ読むことになるため） */
function getStartup(debug) {
  TIMING = [];
  const t0 = Date.now();
  const me = tm_('起動：本人の確認とマスタ（決裁者リスト・シート）', () => me_());
  const out = {
    boot: tm_('起動：画面の設定を作る', () => bootstrapFor_(me)),
    lists: tm_('起動：一覧を作る', () => listsFor_(me))
  };
  tm_('起動：前回の内容として覚える', () => saveStartupCache_(me, out));
  tm_('起動：最近使った人を記録', () => noteRecentUser_(me));
  if (debug) out._timing = TIMING.concat([['getStartup の合計', Date.now() - t0]]);
  return out;
}

/** 最近アプリを開いた人（自動の覚え直しの対象）。1日に1回だけ書く */
const RECENT_USERS_KEY = 'STARTUP_RECENT_USERS';
const RECENT_USERS_DAYS = 14;
function noteRecentUser_(email) {
  try {
    const props = PropertiesService.getScriptProperties();
    const list = parseJson_(props.getProperty(RECENT_USERS_KEY), {}) || {};
    const now = Date.now();
    if (list[email] && now - list[email] < 86400000) return;
    list[email] = now;
    Object.keys(list).forEach(e => { if (now - list[e] > RECENT_USERS_DAYS * 86400000) delete list[e]; });
    props.setProperty(RECENT_USERS_KEY, JSON.stringify(list));
  } catch (err) {
    console.warn('最近使った人を覚えられませんでした: ' + err);
  }
}

/**
 * 自動の覚え直し（トリガーから数時間ごとに呼ばれる）。
 * テスト運用の人（C列・D列）と、最近アプリを開いた人の起動の情報を作り直して覚えておく。
 * こうしておくと、しばらくあけて開いても、前回の一覧がすぐに出る
 */
function refreshStartupCaches() {
  clearSheetNamesCache_();   // シートの名前も調べ直して、また6時間覚えておく
  const m = masters_();
  const recent = Object.keys(parseJson_(PropertiesService.getScriptProperties().getProperty(RECENT_USERS_KEY), {}) || {});
  const trial = m.trial ? m.trial.notify.concat(m.trial.users) : [];
  const allowed = e => !m.trial || !m.trial.users.length || m.trial.users.indexOf(e) !== -1 || m.trial.notify.indexOf(e) !== -1;
  const targets = uniq_(trial.concat(recent).map(lc_)).filter(allowed).slice(0, 60);
  const started = Date.now();
  let n = 0;
  targets.forEach(email => {
    if (Date.now() - started > 4 * 60 * 1000) return;   // 6分の上限の前にやめる
    try {
      saveStartupCache_(email, { boot: bootstrapFor_(email), lists: listsFor_(email) });
      n++;
    } catch (err) {
      console.warn('覚え直せませんでした（' + email + '）: ' + err);
    }
  });
  console.log('起動の情報を覚え直しました：' + n + ' 人');
  return n;
}

/** メニュー：開くのを速く保つ（4時間ごとに自動で覚え直す）を始める */
function startKeepFast() {
  stopKeepFast_();
  ScriptApp.newTrigger('refreshStartupCaches').timeBased().everyHours(4).create();
  const n = refreshStartupCaches();
  SpreadsheetApp.getUi().alert('「開くのを速く保つ」を始めました。\n\n4時間ごとに、テスト運用の人と最近アプリを開いた人の一覧を作り直して覚えておきます。' +
    'しばらくあけて開いても、前回の一覧がすぐに出ます。\n\n今回覚え直した人数：' + n + ' 人');
}

function stopKeepFast() {
  const n = stopKeepFast_();
  SpreadsheetApp.getUi().alert(n ? '「開くのを速く保つ」を止めました。' : '「開くのを速く保つ」は動いていません。');
}

function stopKeepFast_() {
  let n = 0;
  ScriptApp.getProjectTriggers().filter(t => t.getHandlerFunction() === 'refreshStartupCaches').forEach(t => {
    ScriptApp.deleteTrigger(t);
    n++;
  });
  return n;
}

/*
 * 起動の情報を、その人ごとに覚えておく（次に開いたとき、すぐに表示するため）。
 * サーバーの中（スクリプトのキャッシュ）にだけ置き、6時間で消える。大きいときは縮めて置き、入らなければ覚えない
 */
const STARTUP_CACHE_SEC = 21600;
function saveStartupCache_(email, data) {
  if (!email) return;
  const cache = CacheService.getScriptCache();
  try {
    const z = Utilities.base64Encode(Utilities.gzip(Utilities.newBlob(JSON.stringify(data), 'application/json')).getBytes());
    if (z.length < 95000) cache.put('startup:' + email, z, STARTUP_CACHE_SEC);
    else cache.remove('startup:' + email);
  } catch (err) {
    console.warn('起動の情報を覚えられませんでした: ' + err);
  }
}

function cachedStartup_(email) {
  if (!email) return null;
  try {
    const z = CacheService.getScriptCache().get('startup:' + email);
    if (!z) return null;
    return JSON.parse(Utilities.ungzip(Utilities.newBlob(Utilities.base64Decode(z), 'application/x-gzip')).getDataAsString('UTF-8'));
  } catch (err) {
    return null;
  }
}
